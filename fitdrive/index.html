/* ---------- guide + how ---------- */
function guideHTML(){
  return `<div class="stack"><header class="plan-head"><span class="eyebrow blue">Buying guide</span><h1 id="pagetitle" tabindex="-1">Before you sign</h1><p>Ask the right questions, drive it properly, get it checked, read the paperwork, and know which numbers to hold on to.</p>
      <nav class="toc" aria-label="On this page">${[...(Object.keys(MODEL_GUIDES).length?[["gm","Model guides"]]:[]),["g0","Questions to ask first"],["gd","On the test drive"],["g1","Get it inspected"],["gp","Paying for it"],["g2","Read the paperwork"],["g3","Tactics that work"],["g4","Where to stand firm"],["g5","Private sellers"]].map(x=>`<button type="button" class="tbtn" data-scroll="${x[0]}-s">${x[1]}</button>`).join("")}</nav></header>
    ${modelGuidesHTML()}
    <section class="section" id="g0-s" aria-labelledby="g0"><h2 id="g0">Questions to ask before you go</h2><p class="muted">Call or email first. The answers decide whether the trip is worth it.</p>
      <ul class="plain"><li>Is it still for sale, and is the listed price before tax and fees?</li><li>Are there dealer add-ons already on it, and can they come off?</li><li>Are all recalls done? Can I see the service records?</li><li>Has it been in an accident, and is the title clean?</li><li>For a used car: can I take it for an independent inspection?</li><li>How many keys come with it?</li></ul></section>
    <section class="section" id="gd-s" aria-labelledby="gd"><h2 id="gd">On the test drive</h2><p class="muted">Give it 30 minutes, not 10. Drive it the way you'll really use it.</p>
      <div class="grid2"><div class="box"><h3>Before you drive</h3><p>Ask them not to warm it up, so you hear it start cold. Walk around it in daylight and look for mismatched paint, uneven gaps and tire wear on one edge.</p></div>
        <div class="box"><h3>On the road</h3><p>Take your commute, a highway on-ramp, a rough street and a parking lot. With the radio off, listen for clunks over bumps and squeals or grinding when braking.</p></div>
        <div class="box"><h3>Hands light on the wheel</h3><p>It should track straight and stop straight. A pull to one side, a shimmy or a soft pedal is worth asking about.</p></div>
        <div class="box"><h3>Try everything, then fit your life in it</h3><p>Windows, locks, heat and A/C, seat heaters, the screen, phone pairing, cameras and sensors. Bring the car seat, the stroller or the tallest passenger, and check that it fits where you park.</p></div></div>
      <p class="fine">After the drive, look at the dash with the engine running. Any warning light stays on the list for the inspection.</p></section>
    <section class="section" id="g1-s" aria-labelledby="g1"><h2 id="g1">Get it inspected</h2><p class="muted">For any used car, even a certified one, pay an independent mechanic to look it over before you buy. You arrange it and pay for it; the seller just has to agree. On a FitDrive request, tick "I'd like an independent inspection" so the seller knows from the start.</p>
      <div class="grid3"><div class="box"><h3>A shop near the seller</h3><p>Most dealers will let you drive it to a nearby shop. Call ahead and book a pre-purchase inspection. Every used car's page in FitDrive has a map of shops within 5, 10 or 15 miles of the car.</p></div><div class="box"><h3>A mobile inspector</h3><p>They come to the car. Handy for private sellers, or a dealer too far away to visit twice.</p></div><div class="box"><h3>Your own mechanic</h3><p>Someone who already works on your cars and has no stake in the sale.</p></div></div>
      <div class="grid2"><div class="box" style="background:var(--ground)"><h3>What a good one checks</h3><p>Body and frame, engine and transmission, brakes and tires, electronics, a computer scan for fault codes, a road test and photos. For a hybrid or EV, ask for a battery health report.</p></div><div class="box" style="background:var(--ground)"><h3>What it costs</h3><p>Roughly $100 to $450, depending on how thorough it is.</p></div></div>
      <div class="note bad"><b>Red flag:</b> a seller who won't allow an inspection. Ask why, and be ready to walk away.</div></section>
    <section class="section" id="gp-s" aria-labelledby="gp"><h2 id="gp">Paying for it</h2>
      <div class="grid2"><div class="box"><h3>Get preapproved first</h3><p>A loan offer from your bank or credit union gives you a rate to beat before you ever sit down with a finance manager.</p></div>
        <div class="box"><h3>Decide your numbers at home</h3><p>Pick your down payment and loan length with the <button type="button" class="linkbtn" data-go="browse">payment calculator on any car</button>, so the monthly number isn't decided for you at the desk.</p></div>
        <div class="box"><h3>Don't stretch the loan to hit a payment</h3><p>Going from 60 to 72 or 84 months lowers the payment and raises the total interest. You can also owe more than the car is worth for longer.</p></div>
        <div class="box"><h3>If the dealer beats your rate</h3><p>Take it, then check the contract: the same price, the same term, and nothing added to make up the difference.</p></div></div></section>
    <section class="section" id="g2-s" aria-labelledby="g2"><h2 id="g2">Read the paperwork</h2><p class="muted">Ask for the buyer's order before you sit down to sign, and check it line by line.</p>

function liveZipValue(){return S.A.zip&&/^\d{5}$/.test(S.A.zip)?S.A.zip:null;}

function liveBase(){

// Everything to search: the plan's models, brands tried after the plan, and Browse picks.
function liveModels(){
  const ids=new Set(liveBase());
  (S.tryBrands||[]).forEach(mk=>MODELS.filter(m=>m.make===mk).forEach(m=>ids.add(m.id)));
  const b=S.browse||{};
  if(b.make&&b.make!=="any") MODELS.filter(m=>m.make===b.make).forEach(m=>ids.add(m.id));
  if(b.model&&b.model!=="any") ids.add(b.model);
  // Shop-by picks (a type, a powertrain or a group) also search up to 8 matching models, most popular first.
  const pick=m=>(b.body==="any"||!b.body||m.body===b.body)&&(b.pt==="any"||!b.pt||m.pt===b.pt)&&(!b.group||b.group==="any"||(GROUPS[b.group]&&GROUPS[b.group](m)));

    const pop=id=>{const i=POPULAR_IDS.indexOf(id);return i<0?99:i;};
    MODELS.filter(pick).sort((x,y)=>pop(x.id)-pop(y.id)).slice(0,8).forEach(m=>ids.add(m.id));

}
function ssGet(k){try{const v=JSON.parse(sessionStorage.getItem(k)||"null");return v&&Date.now()-v.at<6*3600e3?v.rows:null;}catch(e){return null;}}

async function fetchModel(zip,dist,id){
  const k=`fd-live-${zip}-${dist}-${id}`, c=ssGet(k); if(c) return c;

    try{

      if(r.status===429){await new Promise(res=>setTimeout(res,1300));continue;}

}
async function fetchNational(id){

function ensureLive(){

  const dist=liveDistance(), ids=liveModels(), nat=!!S.nationwide, key=zip+"-"+dist+"-"+(nat?"N-":"")+ids.join(".");
  if(S.liveKey===key) return;
  // Adding a brand or model to a search that already loaded keeps the page up while it searches.
  S.liveSoft=S.liveState==="ok"&&S.liveZip===zip&&S.liveDist===dist;
  S.liveKey=key; S.liveState="loading"; S.liveDone=0; S.liveTotal=ids.length;
  const rows=[], far=[]; let failed=0, i=0;
  const worker=async()=>{while(i<ids.length){const id=ids[i++], cached=!!ssGet(`fd-live-${zip}-${dist}-${id}`)&&(!nat||!!ssGet(`fd-nat-${id}`));
    try{const got=await fetchModel(zip,dist,id);got.forEach(x=>rows.push(Object.assign({},x,{modelId:id})));}catch(e){failed++;}
    if(nat){try{const got=await fetchNational(id);got.forEach(x=>far.push(Object.assign({},x,{modelId:id,national:true})));}catch(e){}}
    if(S.liveKey!==key) return; S.liveDone++; const el=document.getElementById("live-progress"); if(el) el.textContent=`Checked ${S.liveDone} of ${S.liveTotal} models`;
    if(!cached) await new Promise(res=>setTimeout(res,250));}};
  Promise.all([worker(),worker(),worker()]).then(()=>{
    if(S.liveKey!==key) return;
    const n=setLive(rows.concat(far),ids,liveBase(),zipLL(zip),dist); S.liveZip=zip; S.liveDist=dist; S.liveCount=n; S.liveIds=ids; S.liveSoft=false;

}

function netlifyPost(form,fields){
  const body=new URLSearchParams(Object.assign({"form-name":form,"bot-field":""},fields)).toString();
  return fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body}).then(r=>{if(!r.ok)throw new Error(r.status);return r;});

const keepScroll=fn=>{const y=window.scrollY;fn();window.scrollTo(0,y);};

/* ---------- owner reviews ---------- */
// Approved reviews live in /fitdrive-reviews.json (outside fitdrive/), written by fitdrive_reviews.py from the
// Netlify Forms export. Nothing a reviewer sends shows up until Donde approves it.
let REVIEWS=null, REVIEWS_LOADING=false;
function loadReviews(){
  if(REVIEWS||REVIEWS_LOADING) return;
  if(!LIVE){REVIEWS={};return;}
  REVIEWS_LOADING=true;
  fetch("/fitdrive-reviews.json",{cache:"no-cache"}).then(r=>r.ok?r.json():{reviews:[]}).then(j=>{
    const by={}; (Array.isArray(j.reviews)?j.reviews:[]).forEach(rv=>{if(rv&&rv.model)(by[rv.model]=by[rv.model]||[]).push(rv);}); REVIEWS=by;
  }).catch(()=>{REVIEWS={};}).finally(()=>{REVIEWS_LOADING=false;if(["car","compare"].includes(S.view))keepScroll(render);});
}
// Category ratings: entered as Poor / Fair / Good / Great / Excellent and stored as 2, 4, 6, 8, 10.
const RV_CATS=[["rel","Reliability"],["comfort","Comfort"],["perf","Performance"],["econ","Fuel economy"],["charge","Holding a charge"],["tow","Towing"],["value","Value for money"],["space","Space and practicality"]];
// The categories owners rate for a model: "Holding a charge" (how well the battery keeps its range as it ages)
// only for electric and plug-in cars, "Towing" only for models rated to tow 1,500 lb or more.
const catsFor=m=>RV_CATS.filter(([k])=>k==="charge"?!!m&&(m.pt==="bev"||m.pt==="phev"):k==="tow"?!!m&&+m.tow>=1500:true);
const RV_LEVELS=[[2,"Poor"],[4,"Fair"],[6,"Good"],[8,"Great"],[10,"Excellent"]];
const catLabel=(m,k)=>k==="econ"&&m&&m.pt==="bev"?"Range and charging":(RV_CATS.find(c=>c[0]===k)||[k,k])[1];
function reviewStats(id){
  const list=(REVIEWS&&REVIEWS[id])||[]; if(!list.length) return {n:0,list,cats:{},dist:[0,0,0,0,0]};
  const avg=list.reduce((a,r)=>a+(+r.rating||0),0)/list.length, yes=list.filter(r=>r.again===true||r.again==="yes").length;
  const cats={}; RV_CATS.forEach(([k])=>{const v=list.map(r=>+(r.cats||{})[k]).filter(x=>x>=1&&x<=10);if(v.length)cats[k]={avg:Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10,n:v.length};});
  const dist=[0,0,0,0,0]; list.forEach(r=>{const x=+r.rating||0;dist[x>=9?0:x>=7?1:x>=5?2:x>=3?3:4]++;});
  const ranked=Object.entries(cats).filter(([,c])=>c.n>=2).sort((a,b)=>b[1].avg-a[1].avg);
  const best=ranked.filter(([,c])=>c.avg>=7).slice(0,2).map(x=>x[0]), worst=ranked.length>=3?ranked.slice(-1).filter(([k,c])=>c.avg<7&&!best.includes(k)).map(x=>x[0]):[];
  return {n:list.length,avg:Math.round(avg*10)/10,again:Math.round(yes/list.length*100),cats,dist,best,worst,
    list:list.slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))};
}
function catBarsHTML(m,st){
  const ks=catsFor(m).map(c=>c[0]).filter(k=>st.cats[k]); if(!ks.length) return "";
  return `<div class="catbars">${ks.map(k=>{const c=st.cats[k];return `<div class="catbar${st.best&&st.best.includes(k)?" hi":st.worst&&st.worst.includes(k)?" lo":""}"><span>${esc(catLabel(m,k))}</span><div class="b"><i style="width:${c.avg*10}%"></i></div><b>${c.avg}</b></div>`;}).join("")}</div>`;
}
function strengthsHTML(m,st){
  if(!st.best||(!st.best.length&&!st.worst.length)) return "";
  const nm=ks=>ks.map(k=>catLabel(m,k).toLowerCase()).join(" and ");
  return `<p class="strengths">${st.best.length?`<span><b>Owners rate it best for</b> ${esc(nm(st.best))}</span>`:""}${st.worst.length?`<span><b>Lowest marks for</b> ${esc(nm(st.worst))}</span>`:""}</p>`;
}
// Compact rating line for the top of a car page and for cards.
function ratingLineHTML(L,short){
  loadReviews();

  if(REVIEWS===null) return "";
  if(!st.n) return short?"":`<button type="button" class="rline" data-act="rv-jump" data-id="${esc(L.model.id)}" data-write="1">No owner reviews yet · <u>Write the first</u></button>`;
  const m=L.model, nm=ks=>ks.map(k=>catLabel(m,k).toLowerCase()).join(" and ");

// The owner-ratings card beside the price: the owner score, then "How it rates", one row per category.
// A row shows owners' average out of 10 once RV_MIN owners have rated it. Until then it shows the official
// figure where there is one (NHTSA for safety and complaints, the EPA for fuel economy and range, the maker
// for towing), with the source named. Official figures are never averaged into owner ratings.
const RV_MIN=3;
function ownerCardHTML(L){
  loadReviews();
  const m=L.model, st=reviewStats(m.id);
  if(REVIEWS===null) return `<div class="pricebox"><b>Owner ratings</b><p class="hint" role="status">Loading…</p></div>`;
  const top=st.n?`<div class="row" style="justify-content:space-between;align-items:baseline"><b>Owner ratings</b><span class="hint">${st.n} review${st.n>1?"s":""}</span></div>
    <div class="ocard-top"><span class="big num">${st.avg}</span><span class="of">/ 10</span>${wheelsHTML(st.avg)}</div>
    <p class="hint">${st.again}% would buy it again</p>`
    :`<b>Owner ratings</b><p class="hint">No owner reviews of the ${esc(m.make+" "+m.model)} yet, so here are the official figures for now.</p>`;
  const btns=st.n?`<div class="row"><button type="button" class="tbtn" data-act="rv-jump" data-id="${esc(m.id)}">Read the reviews</button><button type="button" class="tbtn" data-act="rv-jump" data-id="${esc(m.id)}" data-write="1">Write a review</button></div>`
    :`<button type="button" class="btn ghost small" data-act="rv-jump" data-id="${esc(m.id)}" data-write="1">Own one? Write the first review</button>`;
  return `<div class="pricebox ocard">${top}${ratingChartHTML(L,st)}${st.n?strengthsHTML(m,st):""}${btns}${moreReviewsHTML(L)}</div>`;

/* ---------- real-world fuel economy (EPA My MPG, through fitdrive-listings) ---------- */
function loadMpg(L){
  if(!LIVE||!L||!L.model||L.model.pt==="bev") return; S.mpg=S.mpg||{}; const k=L.model.id+"-"+L.year;
  if(S.mpg[k]!==undefined) return;
  const c=ssGet("fd-mpg-"+k); if(c){S.mpg[k]=c;return;}
  S.mpg[k]=null;
  fetch(`/.netlify/functions/fitdrive-listings?mpg=${encodeURIComponent(L.model.id)}&year=${L.year}&pt=${encodeURIComponent(L.model.pt)}`).then(r=>r.json()).then(j=>{S.mpg[k]=j&&j.ok?j:{ok:false};if(j&&j.ok)ssSet("fd-mpg-"+k,j);})
    .catch(()=>{S.mpg[k]={ok:false};}).finally(()=>{if(S.view==="car")keepScroll(render);});
}
// The official figure for a row, or null when there isn't one. t = the text, h = HTML shown before it, src = where it's from.
function dataFact(L,k){
  const m=L.model, y=L.year, pl=(n,w)=>`${num(n)} ${w}${n===1?"":"s"}`;
  if(k==="safety"){
    const r=ratingFor(L);
    if(r===undefined||r===null) return {t:"Checking NHTSA…"};
    if(r.error) return {t:"Couldn't reach NHTSA just now."};
    if(r.none) return {t:`Not crash-tested by NHTSA for ${y}.`,src:"NHTSA"};
    return {h:`${starsHTML(r.overall)} <b>${r.overall} of 5</b> `,t:r.example?"Example rating":"Overall crash rating",src:r.example?"":"NHTSA"};
  }
  if(k==="rel"){
    const r=ratingFor(L); if(!r||r.error||r.example) return null;
    const v=r.none?(r.variants||[])[0]:r; if(!v||v.complaints==null) return null;
    return {t:`${pl(v.complaints,"complaint")} and ${pl(v.recalls,"recall")} on file for ${y} models`,src:"NHTSA"};
  }
  if(k==="econ"){
    if(m.pt==="bev") return m.range?{t:`About ${num(m.range)} miles of range for a typical version`,src:"EPA"}:null;
    const j=S.mpg&&S.mpg[m.id+"-"+y]; if(j===undefined) return null; if(j===null) return {t:"Checking the EPA…"}; if(!j.ok) return null;
    if(j.owners&&j.owners.n) return {t:`Owners average ${j.owners.mpg} mpg across ${pl(j.owners.n,"driver")}${j.epa?`, against an EPA rating of ${j.epa.comb}`:""}`,src:"EPA My MPG"};
    if(j.epa) return {t:`${j.epa.comb} mpg combined${j.epa.city&&j.epa.hwy?` (${j.epa.city} city, ${j.epa.hwy} highway)`:""}`,src:"EPA rating"};
    return null;
  }
  if(k==="tow") return m.tow?{t:`Rated to tow up to ${lbkg(m.tow)}`,src:"Maker's rating"}:null;
  return null;
}
function ratingChartHTML(L,st){
  loadRatings(L); loadMpg(L);
  const m=L.model, keys=[];
  catsFor(m).forEach(([k])=>{keys.push(k); if(k==="rel") keys.push("safety");});
  const rows=keys.map(k=>{
    const label=k==="safety"?"Safety":catLabel(m,k), c=st.cats&&st.cats[k], f=dataFact(L,k);
    const src=f&&f.src?` <span class="dot">·</span> <em>${esc(f.src)}</em>`:"";
    if(c&&c.n>=RV_MIN) return `<div class="rrow"><span class="rl">${esc(label)}</span><div class="b" role="img" aria-label="${esc(label)}: ${c.avg} out of 10 from ${c.n} owners"><i style="width:${c.avg*10}%"></i></div><b>${c.avg}</b>
      <span class="rs">${c.n} owner ratings${f&&f.t&&f.src?` · ${esc(f.t)}${src}`:""}</span></div>`;
    const sofar=c&&c.n?`${c.n} owner rating${c.n>1?"s":""} so far, ${RV_MIN} needed for a score`:"";
    const body=f?`${f.h||""}${esc(f.t)}${src}${sofar?`<span class="rc">${sofar}</span>`:""}`:`<span class="none">${sofar||"No owner ratings yet"}</span>`;
    return `<div class="rrow rfact"><span class="rl">${esc(label)}</span><span class="rf">${body}</span></div>`;
  }).join("");
  return `<div class="rchart"><span class="eyebrow">How it rates</span><p class="hint rleg">Bars show owners' average out of 10 once ${RV_MIN} owners have rated it. Until then you see the official figure, with its source.</p>${rows}</div>`;
}
// Plain links to owner reviews elsewhere. FitDrive doesn't copy or average them.
function moreReviewsHTML(L){
  const m=L.model, y=L.year, h=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""), u=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
  const links=[["Edmunds",`https://www.edmunds.com/${h(m.make)}/${h(m.model)}/${y}/consumer-reviews/`],
    ["Kelley Blue Book",`https://www.kbb.com/${h(m.make)}/${h(m.model)}/${y}/consumer-reviews/`],
    ["Cars.com",`https://www.cars.com/research/${h(m.make)}-${u(m.model)}-${y}/consumer-reviews/`]];
  return `<p class="hint morerv">More owner reviews of the ${esc(y+" "+m.model)}: ${links.map(([n,href])=>`<a href="${href}" target="_blank" rel="noopener">${n}</a>`).join(" · ")}</p>`;
}
const WHEEL=`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M3.6 10.5h6.2M14.2 10.5h6.2M12 14.2v6.4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
function wheelsHTML(score){

        <div class="dist">${["9 to 10","7 to 8","5 to 6","3 to 4","1 to 2"].map((lb,i)=>`<div class="catbar"><span>${lb}</span><div class="b"><i style="width:${Math.round(st.dist[i]/st.n*100)}%"></i></div><b>${Math.round(st.dist[i]/st.n*100)}%</b></div>`).join("")}</div></div>

      <div class="rv-score">${wheelsHTML(+r.rating||0)} <b>${esc(String(r.rating))}/10</b> ${r.again===true||r.again==="yes"?`<span class="pill good">Would buy it again</span>`:`<span class="pill amber">Wouldn't buy it again</span>`}</div>

      ${r.love?`<p><b>Loves:</b> ${esc(r.love)}</p>`:""}${r.bugs?`<p><b>Bugs them:</b> ${esc(r.bugs)}</p>`:""}${r.broke?`<p><b>What broke:</b> ${esc(r.broke)}</p>`:""}</article>`).join("")}</div>`;
  return `<section class="section" aria-labelledby="rv-h">${head}${body}
    <div class="row"><button type="button" class="btn ghost small" data-act="rv-open" data-id="${esc(m.id)}" aria-expanded="${!!open}">${open?"Close":"Own one, or used to? Write a review"}</button></div>

function rvState(id){S.rv=S.rv||{};return S.rv[id]=S.rv[id]||{own:"current",again:"",rating:0,year:"",owned:"",miles:"",name:"",email:"",love:"",bugs:"",broke:"",vin:"",agree:false,cats:{},err:"",sending:false,sent:false};}

function sendReview(id){
  const m=MODELS.find(x=>x.id===id), r=rvState(id); if(!m||r.sending) return;
  const miss=[!r.year&&"the model year",!r.rating&&"a rating",!r.again&&"whether you'd buy it again",!r.name.trim()&&"a name to show",!/^\S+@\S+\.\S+$/.test(r.email)&&"your email",!r.agree&&"the checkbox"].filter(Boolean);
  if(miss.length){r.err="Please add "+miss.join(", ")+".";keepScroll(render);return;}
  if(!LIVE){r.sent=true;keepScroll(render);toast("Demo only: reviews are sent on the live site");return;}
  r.sending=true;r.err="";keepScroll(render);
  netlifyPost("fitdrive-review",{model:id,car:m.make+" "+m.model,year:r.year,own:r.own,owned:r.owned,miles:r.miles,rating:r.rating,again:r.again,love:r.love,bugs:r.bugs,broke:r.broke,name:r.name.trim(),email:r.email.trim(),vin:r.vin.trim(),agree:"yes",
    ...Object.fromEntries(RV_CATS.map(([k])=>["c_"+k,r.cats[k]?String(r.cats[k]):""]))})
    .then(()=>{r.sending=false;r.sent=true;keepScroll(render);toast("Review sent. Thank you.");})
    .catch(()=>{r.sending=false;r.err="It didn't send. Check your connection and try again.";keepScroll(render);});
}
function ownerPill(L){if(!REVIEWS)return "";const st=reviewStats(L.model.id);return st.n?`<span class="pill">Owners ${st.avg}/10</span>`:"";}
function reviewCell(L){const st=reviewStats(L.model.id);return st.n?`${st.avg} / 10 · ${st.again}% would buy again (${st.n})`:`<span class="no">No reviews yet</span>`;}

/* ---------- recalls (NHTSA) ---------- */
function loadRecalls(L){
  if(!LIVE||!L||!L.model) return; S.recalls=S.recalls||{}; const k=L.model.id+"-"+L.year;
  if(S.recalls[k]!==undefined) return;
  const c=ssGet("fd-rc-"+k); if(c&&Array.isArray(c.recalls)){S.recalls[k]=c;return;}
  S.recalls[k]=null;
  fetch(`/.netlify/functions/fitdrive-listings?recalls=${encodeURIComponent(L.model.id)}&year=${L.year}`).then(r=>r.json()).then(j=>{const ok=j&&j.ok&&Array.isArray(j.recalls);S.recalls[k]=ok?j:{ok:false};if(ok)ssSet("fd-rc-"+k,j);})
    .catch(()=>{S.recalls[k]={ok:false};}).finally(()=>{if(S.view==="car")keepScroll(render);});
}
const compText=c=>{const t=String(c||"Recall").toLowerCase().replace(/\s*:\s*/g,": ").replace(/\s*,\s*/g,", ");return t.charAt(0).toUpperCase()+t.slice(1);};
function recallsHTML(L){
  const m=L.model, vin=L.fullVin;
  const check=vin?`<div class="row"><button type="button" class="tbtn" data-act="copy-vin" data-vin="${esc(vin)}">Copy VIN</button><a href="https://www.nhtsa.gov/recalls?vin=${encodeURIComponent(vin)}" target="_blank" rel="noopener">Check this exact car at NHTSA</a></div>`
    :`<a href="https://www.nhtsa.gov/recalls" target="_blank" rel="noopener">Check any VIN at NHTSA</a>`;
  let body;
  if(!LIVE) body=`<p>The live version lists every NHTSA recall for the ${L.year} ${esc(m.make+" "+m.model)}, with what can go wrong and the free fix.</p>`;
  else{
    loadRecalls(L); const j=(S.recalls||{})[m.id+"-"+L.year];
    if(j===null||j===undefined) body=`<p class="muted" role="status">Checking NHTSA's recalls…</p>`;
    else if(!j.ok) body=`<p class="muted">NHTSA's recall list couldn't load right now.</p>`;
    else if(!j.recalls.length) body=`<p>NHTSA lists no recalls for the ${L.year} ${esc(m.make+" "+m.model)}.</p>`;
    else body=`<p>${j.recalls.length} recall${j.recalls.length>1?"s":""} for the ${L.year} ${esc(m.make+" "+m.model)}. Not every car in a model year is affected, and recall repairs are free at any ${esc(m.make)} ${m.make==="Tesla"?"service center":"dealer"}. Ask the seller to show that each one was done.</p>
      <div class="rclist">${j.recalls.map((x,i)=>`<details class="rc"${i<1?" open":""}><summary><b>${esc(compText(x.component))}</b><span class="hint">${esc(fmtDate(x.date))} · ${esc(x.id)}</span>${x.parkIt?`<span class="pill bad">Don't drive until fixed</span>`:""}</summary>
        <p>${esc(x.summary)}</p>${x.consequence?`<p><b>The risk:</b> ${esc(x.consequence)}</p>`:""}${x.remedy?`<p><b>The fix:</b> ${esc(x.remedy)}</p>`:""}</details>`).join("")}</div>`;
  }
  return `<section class="section" aria-labelledby="rc-h"><div class="sec-head"><h2 id="rc-h">Recalls</h2><span class="hint">${LIVE?"NHTSA, "+L.year+" model year":"Example"}</span></div>${body}${check}</section>`;
}

/* ---------- what's my car worth ---------- */
const VALUE_MAKES=["Acura","Audi","BMW","Buick","Cadillac","Chevrolet","Chrysler","Dodge","Ford","Genesis","GMC","Honda","Hyundai","Infiniti","Jaguar","Jeep","Kia","Land Rover","Lexus","Lincoln","Mazda","Mercedes-Benz","Mini","Mitsubishi","Nissan","Porsche","Ram","Subaru","Tesla","Toyota","Volkswagen","Volvo"];
function wState(){S.worth=S.worth||{year:"",make:"",model:"",miles:"",awd:"any",hybrid:false,cond:"good",zip:"",models:null,res:null,busy:false,err:""};if(!S.worth.zip&&prof().zip)S.worth.zip=prof().zip;return S.worth;}
function loadValueModels(){
  const w=wState(); if(!LIVE||!w.make||!w.year){w.models=null;return;}
  const k=w.make+"-"+w.year; if(w.modelsKey===k) return; w.modelsKey=k; w.models="loading";
  fetch(`/.netlify/functions/fitdrive-listings?models=${encodeURIComponent(w.make.toLowerCase())}&year=${w.year}`).then(r=>r.json()).then(j=>{w.models=j&&j.ok&&Array.isArray(j.models)?j.models:[];})
    .catch(()=>{w.models=[];}).finally(()=>{if(S.view==="worth")keepScroll(render);});
}
function checkValue(){
  const w=wState();
  const miss=[!w.year&&"the year",!w.make&&"the make",!w.model&&"the model",!(+w.miles>=0&&w.miles!=="")&&"the miles",!/^\d{5}$/.test(w.zip)&&"your ZIP code"].filter(Boolean);
  if(miss.length){w.err="Please add "+miss.join(", ")+".";keepScroll(render);return;}
  w.err="";w.busy=true;w.res=null;keepScroll(render);
  const q=new URLSearchParams({value:"1",make:w.make,model:w.model,year:w.year,miles:String(+w.miles||0),zip:w.zip,awd:w.awd,hybrid:w.hybrid?"1":"0"});
  fetch("/.netlify/functions/fitdrive-listings?"+q.toString()).then(r=>r.json()).then(j=>{w.res=j&&j.ok&&(j.enough===false||isFinite(j.mid))?j:{ok:false};})
    .catch(()=>{w.res={ok:false};}).finally(()=>{w.busy=false;keepScroll(render);});
}

  <section class="home-sec" aria-labelledby="guides-h"><div class="sec-rule"><h2 id="guides-h">Guides</h2></div>
    <div class="grid2"><div><h3 class="gh">FitDrive buying guide</h3><div class="linklist">${FD_GUIDES.map(([id,lb])=>`<button type="button" class="linkbtn" data-act="guide-sec" data-sec="${id}">${esc(lb)}</button>`).join("")}
        <button type="button" class="linkbtn" data-go="worth">What's my car worth?</button></div></div>
      <div><h3 class="gh">From Carveyance</h3><div class="linklist">${CV_GUIDES.map(([slug,t,d])=>`<a href="https://carveyance.com/articles/${slug}/" target="_blank" rel="noopener"><b>${esc(t)}</b><span>${esc(d)}</span></a>`).join("")}</div></div></div></section>`;
}
/* ---------- Browse: active filter chips and the "help me choose" banner ---------- */
function filterChipsHTML(f){
  const lab={make:v=>v,model:v=>{const m=MODELS.find(x=>x.id===v);return m?m.make+" "+m.model:v;},body:v=>v==="sport"?"Coupes and convertibles":BODY_LABEL[v]||v,pt:v=>PT_LABEL[v]||v,
    drive:v=>v==="awd"?"AWD or 4WD":"2WD",cond:v=>v==="new"?"New":"Used or certified",seller:v=>v==="dealer"?"Dealers only":"Private sellers only",
    group:v=>GROUP_LABEL[v]||v,max:v=>"Under "+money(+v),miles:v=>"Under "+num(+v)+" mi",mpg:v=>v+"+ MPG",range:v=>v+"+ mi electric range"};
  const on=Object.keys(lab).filter(k=>String(f[k])!==String(BROWSE_DEFAULTS[k]));
  if(!on.length) return "";
  return `<div class="fchips" role="group" aria-label="Active filters">${on.map(k=>`<button type="button" class="fchip" data-act="bf-clear" data-k="${k}" aria-label="Remove filter ${esc(lab[k](f[k]))}">${esc(lab[k](f[k]))}<span aria-hidden="true">×</span></button>`).join("")}<button type="button" class="linkbtn" data-act="reset-browse">Clear all</button></div>`;
}
function browseHelpHTML(){
  if(PLAN) return "";
  return `<div class="helpband"><div><b>Not sure which car is right?</b><span>Answer a few questions and FitDrive ranks every car by how well it fits your life and budget.</span></div><button type="button" class="btn small" data-go="questions">Find my fit</button></div>`;
}

/* =====================================================================
   FitDrive: features and equipment on the car page, and Favorites.
   ===================================================================== */

/* ---------- NHTSA's record for one VIN ---------- */
function loadVin(L){
  const vin=L&&L.fullVin; if(!LIVE||!vin||VIN_EQUIP[vin]!==undefined) return;
  const c=ssGet("fd-eq-"+vin); if(c&&c.equip){VIN_EQUIP[vin]=c;return;}
  VIN_EQUIP[vin]=null;
  fetch(`/.netlify/functions/fitdrive-listings?equip=${encodeURIComponent(vin)}`).then(r=>r.json()).then(j=>{const ok=j&&j.ok&&j.equip&&typeof j.equip==="object";VIN_EQUIP[vin]=ok?j:{ok:false};if(ok)ssSet("fd-eq-"+vin,j);})
    .catch(()=>{VIN_EQUIP[vin]={ok:false};}).finally(()=>{if(["car","compare"].includes(S.view))keepScroll(render);});
}
const TRANS_TEXT=t=>{t=String(t||"");if(!t)return "";if(/manual/i.test(t))return "Manual";if(/cvt|continuously/i.test(t))return "Automatic (CVT)";if(/dual|dct/i.test(t))return "Automatic (dual-clutch)";return /auto/i.test(t)?"Automatic":t;};
const DRIVE_TEXT=d=>{d=String(d||"");if(!d)return "";if(/4wd|4x4|4-wheel/i.test(d))return "4WD";if(/awd|all/i.test(d))return "AWD";if(/fwd|front/i.test(d))return "Front-wheel drive";if(/rwd|rear/i.test(d))return "Rear-wheel drive";return d;};
function equipHTML(L){
  loadVin(L);
  const v=L.fullVin?VIN_EQUIP[L.fullVin]:undefined, vok=v&&v.ok;
  const chip=f=>`<span class="eq ${f.score===1?"yes":f.score===.5?"some":"no"}">${esc(f.label)}${f.src==="vin"?" · by VIN":""}</span>`;
  const facts=[];
  if(vok&&v.trans) facts.push(`<div><span>Transmission</span><span>${esc(TRANS_TEXT(v.trans))}${v.speeds&&+v.speeds>1?`, ${esc(v.speeds)}-speed`:""}</span></div>`);
  if(vok&&v.drive) facts.push(`<div><span>Drive</span><span>${esc(DRIVE_TEXT(v.drive))}</span></div>`);
  const hint=!LIVE||!L.fullVin?"Typical for this model":v===null||v===undefined?"Checking NHTSA's record for this VIN…":vok?"Safety items checked against this car's VIN":"Typical for this model";
  const groups=EQUIP_GROUPS.map(g=>{
    const keys=[...g.keys.map(x=>x[0]),...(g.id==="safety"?["cruise"]:g.id==="comfort"?["heated","third"]:g.id==="tech"?["phone"]:["awd","tow"])];
    return `<div class="box eqbox"><h3>${esc(g.label)}</h3><ul class="eqlist">${keys.map(k=>`<li><span>${esc(MUST_NAMES[k])}</span>${chip(featInfo(L,k))}</li>`).join("")}</ul></div>`;}).join("");
  return `<section class="section" aria-labelledby="eq-h"><div class="sec-head"><h2 id="eq-h">Features and equipment</h2><span class="hint">${hint}</span></div>
    ${facts.length?`<div class="kv">${facts.join("")}</div>`:""}
    <div class="grid2">${groups}</div>
    <p class="fine">Standard, Some trims and Not offered show what the ${esc(L.model.make+" "+L.model.model)} typically has in the years FitDrive covers. Trims and option packages vary, so confirm each one on the ${L.seller==="private"?"seller's":"dealer's"} listing.${LIVE&&L.fullVin?` "By VIN" means NHTSA's record for this exact car says so. Comfort and tech extras like a sunroof or leather aren't in that record.`:""}</p>
    ${L.url?`<a href="${esc(L.url)}" target="_blank" rel="noopener">See the full feature list on the ${L.seller==="private"?"seller's":"dealer's"} listing</a>`:""}</section>`;
}

/* ---------- Favorites ---------- */
const HEART=on=>`<svg class="heart" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 20.3 4.7 13a4.7 4.7 0 0 1 6.6-6.7l.7.7.7-.7a4.7 4.7 0 0 1 6.6 6.7z" fill="${on?"currentColor":"none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`;
function favBtn(L,style){
  const on=S.saved.includes(L.id);
  return `<button type="button" class="tbtn favb${on?" on":""}" data-heart="${L.id}" aria-pressed="${on}"${style?` style="${style}"`:""}>${HEART(on)}${on?"Favorited":"Favorite"}</button>`;
}
// A copy of each favorite, so it stays even when today's search doesn't return it.
function favSnapFor(L){
  const old=(S.favSnap||{})[L.id]||{};
  return {id:L.id,name:lname(L),trim:L.trim||"",price:L.price,savedPrice:old.savedPrice||L.price,miles:L.miles,cond:L.cond,where:L.where||"",city:L.city||"",state:L.state||"",
    url:L.url||"",photo:L.photo||"",vin:L.fullVin||"",modelId:L.model.id,make:L.model.make,live:!!L.live,at:old.at||Date.now()};
}
function toggleFav(id){
  S.favSnap=S.favSnap||{};
  const was=S.saved.includes(id);
  if(was){S.saved=S.saved.filter(x=>x!==id);delete S.favSnap[id];}
  else{const L=listingById(id);S.saved=S.saved.concat(id);if(L)S.favSnap[id]=favSnapFor(L);}
  render(); toast(was?"Removed from Favorites":"Added to Favorites");
}
let FAV_CHECK={};
function checkFav(f){
  if(!LIVE||!f.vin||FAV_CHECK[f.vin]!==undefined) return;
  const c=ssGet("fd-fav-"+f.vin); if(c&&c.ok){FAV_CHECK[f.vin]=c;return;}
  FAV_CHECK[f.vin]=null;
  fetch(`/.netlify/functions/fitdrive-listings?listing=${encodeURIComponent(f.vin)}`).then(r=>r.json()).then(j=>{FAV_CHECK[f.vin]=j&&j.ok?j:{ok:false};if(j&&j.ok)ssSet("fd-fav-"+f.vin,j);})
    .catch(()=>{FAV_CHECK[f.vin]={ok:false};}).finally(()=>{if(S.savedOpen)render();});
}
const shortDate=s=>{const d=new Date(s);return isNaN(d)?"":d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});};
function savedHTML(){
  if(!S.savedOpen) return "";
  S.favSnap=S.favSnap||{};
  const rows=S.saved.map(id=>{
    const L=listingById(id), f=S.favSnap[id]||(L?favSnapFor(L):null);
    if(!f) return "";
    if(L){
      S.favSnap[id]=favSnapFor(L);
      const drop=f.savedPrice&&L.price<f.savedPrice?f.savedPrice-L.price:0;
      return `<div class="listing"><div><button type="button" class="lt" data-go="car-${L.id}">${esc(lname(L))}</button><div class="lm">${condLabel[L.cond]} · ${milesText(L)} · ${esc(L.where)}</div>${drop?`<span class="favst good">Down ${money(drop)} since you saved it</span>`:""}</div>
        <div class="lp">${money(L.price)}</div><div class="lacts"><button type="button" class="tbtn" data-heart="${L.id}">Remove</button><button type="button" class="tbtn" data-cmp="${L.id}" aria-pressed="${S.compare.includes(L.id)}">${S.compare.includes(L.id)?"In compare":"+ Compare"}</button></div></div>`;
    }
    checkFav(f);
    const c=f.vin?FAV_CHECK[f.vin]:undefined;
    let status;
    if(!LIVE||!f.vin) status=`<span class="hint">Not in the current list of cars.</span>`;
    else if(c===null||c===undefined) status=`<span class="hint" role="status">Checking whether it's still for sale…</span>`;
    else if(!c.ok) status=`<span class="hint">Couldn't check right now. Try again later.</span>`;
    else if(!c.found||c.removedAt) status=`<span class="favst warn">${c.removedAt?`Off the market since about ${esc(shortDate(c.removedAt))}. It most likely sold.`:"No longer listed. It may have sold."}</span>`;
    else status=`<span class="favst good">Still for sale${c.price&&c.price!==f.price?`, now ${money(c.price)}`:""}. It isn't in this search, so open the listing to see it.</span>`;
    const gone=c&&c.ok&&(!c.found||c.removedAt);
    return `<div class="listing"><div><b class="lt" style="cursor:default">${esc(f.name)}</b><div class="lm">${condLabel[f.cond]||""} · ${f.cond==="new"?"Delivery miles":num(f.miles)+" mi"} · ${esc(f.where)}${f.city?", "+esc(f.city):""}</div>${status}</div>
      <div class="lp">${money(c&&c.ok&&c.price?c.price:f.price)}</div>
      <div class="lacts"><button type="button" class="tbtn" data-heart="${esc(id)}">Remove</button>${gone?`<button type="button" class="tbtn" data-act="fav-similar" data-model="${esc(f.modelId)}">See similar cars</button>`:f.url||c&&c.vdp?`<a class="tbtn" href="${esc(f.url||c.vdp)}" target="_blank" rel="noopener">Open the listing</a>`:""}</div></div>`;
  }).join("");
  persist();
  return `<div class="in" style="padding-top:14px"><section class="section" aria-label="Favorites"><div class="sec-head"><h2>Favorites</h2><button type="button" class="tbtn" data-act="saved">Close</button></div>
    ${rows||`<p class="muted">No favorites yet. Tap the heart on any car to keep it here.</p>`}
    ${rows&&LIVE?`<p class="fine">Favorites stay on this device until you remove them. When one leaves the market, FitDrive marks it here. Email alerts come once accounts arrive.</p>`:""}</section></div>`;
}
function favTopRender(){
  const b=document.getElementById("favtop"); if(!b) return;
  const n=S.saved.length; b.setAttribute("aria-expanded",S.savedOpen); b.setAttribute("aria-label",`Favorites, ${n} car${n===1?"":"s"}`);
  b.innerHTML=HEART(n>0)+`<span class="favlbl">Favorites</span>`+(n?`<span class="count">${n}</span>`:"");
  b.classList.toggle("on",n>0);
}

/* ---------- account (accounts aren't built yet: this says so, and takes an email for when they open) ---------- */
const PERSON=`<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="8.2" r="3.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20.2c.9-3.9 3.9-6 7.5-6s6.6 2.1 7.5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
function acState(){return S.ac=S.ac||{email:"",sending:false,sent:false,err:""};}
function acctHTML(){
  const a=acState();
  return `<div class="in" style="padding-top:14px"><section class="section" aria-labelledby="ac-h"><div class="sec-head"><h2 id="ac-h">Accounts are coming</h2><button type="button" class="tbtn" data-act="acct">Close</button></div>
    <p>Soon you'll be able to sign in to keep your plan and favorites on every phone and computer, and get an email when a favorite drops in price or sells.</p>
    <p class="muted">For now there's nothing to sign in to. Your answers, plan and ${S.saved.length?`${S.saved.length} favorite${S.saved.length>1?"s":""}`:"favorites"} are saved on this device.${S.planBuilt?` To open your plan on another device, use <button type="button" class="linkbtn" data-act="acct-plan">Save my plan</button>.`:""}</p>
    ${a.sent?`<div class="note good" role="status"><b>Thanks.</b> We'll email you once, when accounts open.</div>`
    :`<form class="rvform" onsubmit="return false" aria-label="Email me when accounts open" style="border-top:0;padding-top:0"><div class="row" style="align-items:flex-end"><label class="fld" style="flex:1 1 240px"><span>Email me when accounts open</span><input data-ac="email" type="email" value="${esc(a.email)}" placeholder="you@example.com" autocomplete="email"></label>
      <button type="button" class="btn small" data-act="acct-send"${a.sending?" disabled":""}>${a.sending?"Sending…":"Notify me"}</button></div>
      ${a.err?`<p class="note bad" role="alert">${esc(a.err)}</p>`:""}<p class="hint">One email, and nothing else. See <a href="#privacy">privacy and terms</a>.</p></form>`}</section></div>`;
}
function sendAcct(){
  const a=acState(); if(a.sending) return;
  if(!/^\S+@\S+\.\S+$/.test(a.email.trim())){a.err="Please add your email.";render();return;}
  if(!LIVE){a.sent=true;a.err="";render();toast("Demo only: this sends on the live site");return;}
  a.sending=true;a.err="";render();
  netlifyPost("fitdrive-accounts",{email:a.email.trim()}).then(()=>{a.sending=false;a.sent=true;render();}).catch(()=>{a.sending=false;a.err="It didn't send. Try again.";render();});
}
function acctTopRender(){
  const b=document.getElementById("accttop"); if(!b) return;
  b.setAttribute("aria-expanded",!!S.acctOpen); b.innerHTML=PERSON+`<span class="favlbl">Account</span>`;
}
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.ac){acState()[el.dataset.ac]=el.value;}});

/* ---------- start the page (last, after every file has loaded) ---------- */
(function boot(){if(loadPlanFromHash()){render(false);return;}const r=parseRoute(location.hash);if(location.hash){S.view=r.view;S.carId=r.carId||null;}else{S.view="home";}render(false);})();

</script>
