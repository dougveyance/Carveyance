<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>FitDrive by Carveyance</title>
<meta name="description" content="FitDrive by Carveyance: tell it how you live and drive, and see the cars that fit with their true monthly cost.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Public+Sans:wght@400;500;600;700&family=Bebas+Neue&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* FitDrive · Brand A "Showroom". Layout: one 1200px column, white cards on a cool ground,
   a dark ink panel for money, drive blue for actions, amber for badges. */
:root{
  --ground:#F5F7FA; --card:#FFFFFF; --ink:#111827; --body:#374151; --muted:#4B5565;
  --line:#E5E8EE; --line2:#CBD2DC; --blue:#1F5FD1; --blue-ink:#1F5FD1; --on-blue:#FFFFFF; --tint:#E6EEFB;
  --amber:#F2A93B; --amber-bg:#FDEFD5; --amber-ink:#7A4B00;
  --good:#166534; --good-bg:#E5F4EA; --bad:#9A3412; --bad-bg:#FCEBE2; --warn-bg:#FDF3DC; --warn-ink:#5F4300;
  --panel:#111827; --on-panel:#FFFFFF; --on-panel-muted:#B4BDCB; --panel-line:#2A3445;
  --glass:#2B3442; --tire:#1B1F27; --hub:#A3ACB9; --art-bg:#E9EEF6; --gauge-track:#D5DEEE;
  --shadow:0 6px 24px rgba(17,24,39,.07); --focus:#F2A93B;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --text:"Public Sans","Helvetica Neue",Arial,sans-serif; --mark:"Bebas Neue",Impact,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0D1117; --card:#161C26; --ink:#E9EDF4; --body:#C8CFDA; --muted:#9DA7B6;
  --line:#263042; --line2:#3A475E; --blue:#2563EB; --blue-ink:#8AB4FF; --on-blue:#FFFFFF; --tint:#17243A;
  --amber:#F2A93B; --amber-bg:#3B2C10; --amber-ink:#F7CD86;
  --good:#86E0AD; --good-bg:#10291C; --bad:#FFB08A; --bad-bg:#35180D; --warn-bg:#33270B; --warn-ink:#F3D08A;
  --panel:#1F2937; --on-panel:#FFFFFF; --on-panel-muted:#B4BDCB; --panel-line:#344155;
  --glass:#0E131B; --tire:#06080C; --hub:#8C96A4; --art-bg:#1B2433; --gauge-track:#2E3A50;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0D1117; --card:#161C26; --ink:#E9EDF4; --body:#C8CFDA; --muted:#9DA7B6;
  --line:#263042; --line2:#3A475E; --blue:#2563EB; --blue-ink:#8AB4FF; --on-blue:#FFFFFF; --tint:#17243A;
  --amber:#F2A93B; --amber-bg:#3B2C10; --amber-ink:#F7CD86;
  --good:#86E0AD; --good-bg:#10291C; --bad:#FFB08A; --bad-bg:#35180D; --warn-bg:#33270B; --warn-ink:#F3D08A;
  --panel:#1F2937; --on-panel:#FFFFFF; --on-panel-muted:#B4BDCB; --panel-line:#344155;
  --glass:#0E131B; --tire:#06080C; --hub:#8C96A4; --art-bg:#1B2433; --gauge-track:#2E3A50;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--text);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
a{color:var(--blue-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:800;font-stretch:110%;letter-spacing:-.01em;text-wrap:balance;margin:0;color:var(--ink)}
p{margin:0}
.in{max-width:1200px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font:700 12px/1.2 var(--text);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow.blue{color:var(--blue-ink)}
.muted{color:var(--muted)}
.fine{font-size:13px;color:var(--muted);line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* demo strip + header */
.demo-strip{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  background:var(--amber-bg);color:var(--amber-ink);font-size:13px;font-weight:600}
.demo-strip .in{padding:7px max(16px,env(safe-area-inset-left,0px))}
.top{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  background:var(--card);border-bottom:1px solid var(--line)}
.top>.in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;text-align:left;color:var(--ink)}
.g-track{stroke:var(--gauge-track)} .g-arc{stroke:var(--blue)} .g-needle{stroke:var(--ink)} .g-hub{fill:var(--ink)}
.wm{display:flex;flex-direction:column;gap:2px}
.wm-fd{font:800 25px/1 var(--display);font-stretch:112%;letter-spacing:-.02em}
.wm-fit{color:var(--blue-ink)}
.wm-by{display:flex;gap:5px;align-items:baseline;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.wm-cv{font:400 14px/1 var(--mark);letter-spacing:.08em}
.cv-car{color:var(--ink)} .cv-vey{color:#4E8DB5}
.mainnav{display:flex;align-items:center;gap:4px;flex:1 1 auto;order:3;width:100%;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.mainnav::-webkit-scrollbar{display:none}
.mainnav button{flex:0 0 auto;background:none;border:0;border-radius:8px;padding:9px 11px;font-weight:600;font-size:15px;color:var(--body);white-space:nowrap}
.mainnav button:hover{background:var(--tint);color:var(--ink)}
.mainnav button[aria-current="page"]{color:var(--blue-ink);background:var(--tint)}
.mainnav .cta{background:var(--blue);color:var(--on-blue)}
.mainnav .cta:hover{background:var(--blue);color:var(--on-blue);filter:brightness(1.08)}
.mainnav .count{display:inline-block;min-width:20px;margin-left:5px;padding:0 6px;border-radius:999px;background:var(--amber-bg);color:var(--amber-ink);font-size:12px;line-height:20px;text-align:center}
.top-tools{margin-left:auto;position:relative;display:flex;gap:8px;align-items:center}
.globe{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line2);border-radius:10px;padding:8px 11px;font-weight:700;font-size:14px;color:var(--ink)}
.langmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:250px;background:var(--card);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:2px}
.langmenu button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;border-radius:9px;padding:11px 12px;font-size:16px;font-weight:500}
.langmenu button[aria-pressed="true"]{background:var(--tint);font-weight:700}
.langmenu .soon{font-size:12px;color:var(--muted);font-weight:500}
.langmenu .lm-foot{border-top:1px solid var(--line);margin-top:4px;padding:8px 12px 4px;font-size:12px;color:var(--muted)}
@media (min-width:980px){.mainnav{order:0;width:auto}}

/* generic */
main{max-width:1200px;margin:0 auto;padding-block:26px 40px;display:block}
main:focus{outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px}
.section>h2{font-size:24px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 14px}
.sec-head h2{font-size:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:var(--on-blue);border:0;border-radius:var(--r-sm);padding:13px 20px;font-weight:700;font-size:16px;text-decoration:none;min-height:46px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line2)}
.btn.ghost:hover{border-color:var(--blue);filter:none}
.btn.small{padding:8px 14px;font-size:14px;min-height:38px}
.btn.amber{background:var(--amber);color:#1A1205}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pill.amber{background:var(--amber-bg);color:var(--amber-ink)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.blue{background:var(--tint);color:var(--blue-ink)}
.tbtn{background:var(--card);border:1.5px solid var(--line2);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--ink)}
.tbtn:hover{border-color:var(--blue)}
.tbtn[aria-pressed="true"]{background:var(--tint);border-color:var(--blue);color:var(--blue-ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.note{border-radius:var(--r-sm);padding:12px 14px;font-size:15px;line-height:1.5}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note.good{background:var(--good-bg);color:var(--good)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.blue{background:var(--tint);color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.box h3{font-family:var(--text);font-stretch:100%;font-size:16px;font-weight:700;letter-spacing:0}
.box p{font-size:14px;color:var(--body);line-height:1.5}
.big{font:800 30px/1.05 var(--display);font-stretch:108%;font-variant-numeric:tabular-nums}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--muted);margin-bottom:14px}
.crumbs button{background:none;border:0;padding:0;color:var(--blue-ink);font-weight:600}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cols{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.cols>.main{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:18px}
.cols>.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--panel);color:var(--on-panel);border-radius:10px;padding:11px 16px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* car art */
.art{display:block;width:100%;max-width:100%;aspect-ratio:16/8;background:var(--art-bg);border-radius:12px}
.art.lg{aspect-ratio:16/8.5;border-radius:16px}
.art-cap{font-size:12px;color:var(--muted);margin-top:6px}

/* home */
.hero{display:flex;flex-wrap:wrap;gap:28px;align-items:center;padding-block:18px 8px}
.hero-copy{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.hero h1{font-size:clamp(42px,7vw,76px);line-height:.98;font-stretch:115%;letter-spacing:-.025em}
.hero .lede{font-size:19px;line-height:1.55;color:var(--body);max-width:36em}
.hero-card{flex:1 1 340px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.trust{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted);font-weight:500}
.steps3{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.steps3 li{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px}
.steps3 .n{font:800 34px/1 var(--display);color:var(--blue-ink)}
.steps3 h3{font-size:19px}
.steps3 p{font-size:15px;color:var(--body)}
.promise{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.promise div{border-left:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.promise b{font-size:16px}
.promise span{font-size:14px;color:var(--body)}
.samples-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sample{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.sample:hover{border-color:var(--blue)}
.sample b{font-size:16px}
.sample span{font-size:14px;color:var(--muted)}
.home-sec{display:flex;flex-direction:column;gap:14px;margin-top:34px}
.home-sec>h2{font-size:28px}
.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}

/* questions */
.flow{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.qcard{flex:999 1 600px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:22px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);border-radius:3px}
.qhead{display:flex;flex-direction:column;gap:8px}
.qhead .eyebrow{display:flex;justify-content:space-between;gap:10px}
.qhead .eyebrow b{color:var(--blue-ink)}
.qhead h1,.qhead h2{font-size:clamp(28px,4vw,38px);line-height:1.08}
.qhead p{color:var(--body);font-size:16px}
.item{display:flex;flex-direction:column;gap:10px}
.item h3{font:700 17px/1.3 var(--text);font-stretch:100%;letter-spacing:0}
.ihelp{font-size:14px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line2);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:2px;min-height:52px}
.opt:hover{border-color:var(--blue)}
.opt .l{font-weight:600;font-size:16px}
.opt .s{font-size:13px;color:var(--muted)}
.opt.on{background:var(--tint);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1.5px solid var(--line2);border-radius:999px;padding:9px 15px;font-size:15px;font-weight:500;min-height:42px}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.money-row{display:flex;flex-direction:column;gap:10px}
.field{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line2);border-radius:12px;padding:0 14px;background:var(--card);max-width:280px}
.field.wide{max-width:420px;padding:0}
.field input,.field select{border:0;background:transparent;padding:13px 0;font-size:16px;width:100%;min-width:0}
.field select{padding:13px 14px}
.field input:focus,.field select:focus{outline:none}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--tint)}
.preview{background:var(--tint);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5}
.nav{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.nav .left-time{margin-right:auto;font-size:14px;color:var(--muted)}
.nav #back{order:-1}
.ledger{flex:1 1 300px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ledger-h{display:flex;justify-content:space-between;align-items:baseline;background:none;border:0;padding:0;text-align:left;width:100%}
.ledger-h b{font:800 19px/1.2 var(--display);font-stretch:108%}
.ledger-h span{font-size:13px;color:var(--muted)}
.facts{display:flex;flex-direction:column}
.fact{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.fact span{color:var(--muted)}
.fact b{text-align:right;font-weight:600}
.insight{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45}
.assume{display:flex;flex-direction:column;gap:6px}
.assume h4{margin:6px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.achip{display:flex;justify-content:space-between;gap:10px;text-align:left;background:var(--ground);border:1px dashed var(--line2);border-radius:9px;padding:8px 10px;font-size:13px}
.achip u{color:var(--blue-ink);font-weight:600}
.hint{font-size:14px;color:var(--muted)}
.ledger-mobile-peek{display:none}
@media (max-width:700px){
  .ledger:not(.open) .ledger-body{display:none}
  .ledger:not(.open) .ledger-mobile-peek{display:block}
  .qcard{padding:20px}
}

/* plan */
.plan-head{display:flex;flex-direction:column;gap:10px}
.plan-head h1{font-size:clamp(30px,4.6vw,46px);line-height:1.05}
.plan-head p{color:var(--body);font-size:17px}
.banner{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--tint);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.tile .k{font:700 12px var(--text);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile h3{font-size:20px}
.tile p{font-size:14px;color:var(--body)}
.tile.now{background:var(--panel);border-color:var(--panel);color:var(--on-panel)}
.tile.now h3{color:var(--on-panel)} .tile.now p,.tile.now .k{color:var(--on-panel-muted)}
.budget{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.bstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bstat{background:var(--ground);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.bstat span{font-size:13px;color:var(--muted)}
.bstat b{font:800 22px/1.1 var(--display);font-stretch:106%;font-variant-numeric:tabular-nums}
.bstat.key{background:var(--tint)} .bstat.key b{color:var(--blue-ink)}
.filters{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.filters-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.filters-h h2{font-size:20px}
.filters-h span{font-size:14px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.fgrid select{background:var(--card);border:1.5px solid var(--line2);border-radius:10px;padding:10px;font-size:15px;color:var(--ink);font-weight:400}
.fgrid select.changed{border-color:var(--blue);background:var(--tint)}
.guard{font-size:13px;color:var(--muted)}
.picks{display:flex;flex-direction:column;gap:16px}
.picks-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.picks-h h2{font-size:26px}

const DEFAULTS = {covers:"yes",repairCost:1750,role:"replace",purpose:"dependable",timing:"6mo",household:"solo",childSeats:1,

function localData(zip,place){
  const dens={city:1.8,suburb:1,rural:.2}[place]||1;

  return {known:ok,zip,climate,chargers10,dcfast25:Math.max(0,Math.round(chargers10*(.18+r2*.12))),

function makeProfile(A){

  p.tradeWorth=tr?(+A.tradeWorth||0):0; p.tradeOwe=tr?(+A.tradeOwe||0):0; p.curPayment=tr?(+A.curPayment||0):0;
  p.equity=p.tradeWorth-p.tradeOwe;

/* ---------- budget: the CarFit gross-up plus a debt-to-income check ---------- */
function budget(p){
  const statedAllIn=p.payment/.60;
  let comfortable=null, stretch=null;
  if(p.income){
    const gm=p.income/12;
    comfortable=Math.max(0,Math.min(gm*.15,gm*.36-p.debt));
    stretch=Math.max(0,Math.min(gm*.20,(gm*.36-p.debt)*1.15));
  }
  const target=comfortable!=null?Math.min(statedAllIn,comfortable):statedAllIn;
  let note;
  if(comfortable==null) note=`A ${money(p.payment)} payment works out near ${money(statedAllIn)} a month once fuel, insurance and upkeep are added. Without income, FitDrive can't check whether that's comfortable.`;
  else if(statedAllIn<=comfortable) note=`A ${money(p.payment)} payment works out near ${money(statedAllIn)} a month all-in. Your income comfortably supports about ${money(comfortable)}, so we're matching to your number, not your maximum.`;
  else note=`A ${money(p.payment)} payment works out near ${money(statedAllIn)} a month all-in. That's above the ${money(comfortable)} your income comfortably supports, so FitDrive plans around ${money(comfortable)}.`;
  return {statedAllIn,comfortable,stretch,target,note};
}

/* ---------- powertrain feasibility ---------- */
function evFeas(p){
  let s=0; const blockers=[], supports=[];
  if(p.l2){s+=45;supports.push("You can charge at home on a 240V outlet, the biggest single factor in whether an EV is easy to live with. You'd start most days full.");}
  else if(p.home&&p.charger==="landlord"){s+=36;supports.push("Home charging looks possible once your landlord agrees. Get that in writing before buying an EV.");}
  else if(p.home){s+=26;supports.push("You park at home, so a regular outlet works. That adds roughly 40 miles overnight.");}
  else if(p.sleeps==="aptcharge"){s+=30;supports.push("Your building has chargers, which solves the hardest part of EV ownership.");}
  else{s+=4;blockers.push("You'd rely on public charging, which turns a 5-minute fuel stop into a weekly 30–40 minute errand.");}
  if(p.sleeps==="street"&&p.workCharge==="yes"){s+=18;supports.push("Reliable charging at work covers most of what home charging would.");}
  const c=p.local.chargers10;
  if(c>=40){s+=15;supports.push(`About ${c} public chargers within 10 miles, a real safety net.`);}
  else if(c>=15) s+=10; else if(c>=5) s+=5;
  else blockers.push(`Only about ${c} public chargers within 10 miles, so there's little backup.`);
  if(p.daily<=60) s+=15; else if(p.daily<=120) s+=9;
  else if(p.daily<=200){s+=4;blockers.push(`A ${p.daily}-mile driving day means charging every night with little margin.`);}
  else blockers.push(`A ${p.daily}-mile driving day is beyond most EVs without a midday charge.`);
  if(p.trips==="rare") s+=10; else if(p.trips==="few") s+=6;
  else{s+=2;blockers.push("Monthly long trips mean planning charging stops again and again.");}
  if(p.trips==="monthly"&&p.local.dcfast25<3){s-=8;blockers.push("There's little DC fast charging nearby for long trips.");}
  if(p.second){s+=10;supports.push("This would be a second car, which removes most EV risk. The other car covers the awkward trips.");}
  if(p.local.climate==="severe"){s-=8;blockers.push("Severe winters cut usable range by roughly 30% and slow charging.");}
  else if(p.local.climate==="cold") s-=4;
  if(p.place==="rural"){s-=6;blockers.push("Rural areas have the thinnest charging coverage.");}
  return {score:clamp(s,0,100)/100,blockers,supports};
}
function hybridFit(p){let s=.6;if(p.annualMiles>15000)s+=.2;if(p.place!=="rural")s+=.12;if(p.trips==="monthly")s+=.08;if(p.sleeps==="street")s+=.1;return Math.min(1,s);}
function phevFit(p){let s=.35;if(p.l2&&p.daily<=45)s+=.4;else if(p.l2)s+=.2;if(p.trips!=="rare")s+=.12;if(!p.home&&p.sleeps!=="aptcharge")s-=.25;return clamp(s,0,1);}
function iceFit(p){let s=.55;if(p.place==="rural")s+=.18;if(p.tow>5000)s+=.15;if(p.annualMiles<8000)s+=.1;if(p.local.climate==="severe")s+=.08;return Math.min(1,s);}

const APR=[[780,.052,.070],[660,.066,.092],[600,.094,.135],[500,.121,.187],[300,.152,.216]];

function loanPmt(P,apr,m){if(P<=0)return 0;const r=apr/12;return P*r/(1-Math.pow(1+r,-m));}
/* Out-the-door. Chicago (ZIP 606xx) uses the real 2026 figures: 10.5% sales tax from Aug 1, 2026,
   Illinois title $165, registration $151, and the state's $378 cap on dealer doc fees. A private sale
   in Illinois pays the state private-party tax instead ($850 on a $15,000–$19,999 car). Everywhere
   else is a labeled national estimate until the live version loads each state's rules. */
function otdFor(L,p){
  const zip=(p&&p.zip)||"", chicago=/^606\d\d$/.test(zip), lines=[];
  let exact=false;
  if(chicago&&L.seller==="dealer"){
    exact=true;
    lines.push(["Sales tax (Chicago, 10.5%)",L.price*.105],["Illinois title fee",165],["Illinois registration",151],["Dealer doc fee (state cap)",378]);
  } else if(chicago){
    exact=L.price>=15000&&L.price<20000;
    lines.push([exact?"Illinois private-party tax":"Illinois private-party tax (estimate)",exact?850:Math.round(L.price*.06)],["Illinois title fee",165],["Illinois registration",151]);
  } else {

    if(L.seller==="dealer") lines.push(["Dealer doc fee (estimate)",300]);

  return {lines,total,exact,chicago};
}
function financeQuote(L,p,months){
  const apr=aprFor(p.credit,L.cond); months=months||60;
  const P=Math.max(0,otdFor(L,p).total-p.down-p.equity);
  return {type:"finance",apr,months,payment:loanPmt(P,apr,months),loan:P};
}
function leaseQuote(L,p){
  if(L.cond!=="new") return null;
  const m=L.model, months=36;
  // Front-loaded depreciation curve with a lender's conservative haircut.
  const res=L.price*Math.max(.30,Math.pow(1-m.dep,(months/12)/5)*.92);
  // Lease cash is lost if the car is totaled: apply at most $3,000 of it, never below the residual.
  const reduction=Math.min(Math.min(p.down,3000)+p.equity,L.price-res);
  const cap=L.price-reduction, mf=aprFor(p.credit,"new")/24;
  const pay=((cap-res)/months+(cap+res)*mf)*1.07;
  const over=Math.max(0,p.annualMiles-12000)*.25/12;
  return {type:"lease",months,payment:pay+over,base:pay,overage:over};
}
/* Electricity by area. Chicago: about 21¢/kWh at home (EnergySage, bills-based) and about 40¢ on a
   mix of public Level 2 (20–35¢) and fast chargers (about 56¢). Elsewhere, national estimates. */
function localRates(p){
  const chicago=/^606\d\d$/.test((p&&p.zip)||"");
  return chicago?{home:.21,pub:.404,gas:GAS,area:"Chicago"}:{home:KWH_HOME,pub:KWH_PUB,gas:GAS,area:"national average"};
}
function homeShareFor(p){return p.l2?.9:p.home||p.sleeps==="aptcharge"?.7:(p.workCharge==="yes"?.6:.2);}
function energyCost(m,p,share){
  const mm=p.annualMiles/12, R=localRates(p);
  const cold=p.local.climate==="severe"?1.30:p.local.climate==="cold"?1.18:1;
  if(m.pt==="bev"){
    const homeShare=share!=null?share:homeShareFor(p);
    return mm/100*m.kwh*cold*(R.home*homeShare+R.pub*(1-homeShare));
  }
  if(m.pt==="phev"){
    const ev=share!=null?share*Math.min(.85,m.range/Math.max(p.daily,1)):(p.home||p.sleeps==="aptcharge"?Math.min(.85,m.range/Math.max(p.daily,1)):.15);
    return mm*ev/100*m.kwh*cold*R.home+mm*(1-ev)/m.mpg*R.gas;
  }
  return mm/m.mpg*R.gas*(cold>1?1.05:1);
}
/* Insurance estimate: year, make, model, features and area only. No driving record, no credit,
   no age. Shown with a range and a disclaimer wherever it appears. */
function insuranceCost(L,p){
  let b=145*L.model.ins;
  if(L.price>60000)b*=1.25; else if(L.price>40000)b*=1.12;
  if(p.place==="city")b*=1.12;
  if(L.age>=8)b*=.9;
  return b;
}
// FitDrive's planning bands: 0–3 yrs $50–100, 4–8 yrs $100–200, 9+ yrs $150–300 a month.
function repairReserve(L,p){
  const m=L.model;
  let r=L.age<=3?60:L.age<=8?140:220;
  r*=clamp(p.annualMiles/12000,.75,1.5)*(1.45-m.rel*.6)*clamp(m.maint/600,.7,1.8);
  if(m.pt==="bev")r*=.75; else if(m.pt==="hybrid")r*=.95;
  if(p.place==="rural"&&m.dealer<.6)r*=1.15;
  return Math.max(40,Math.round(r/5)*5);
}
function structure(L,p){
  let F=0,Lp=0; const rf=[],rl=[];
  if(p.annualMiles>15000){F+=3;rf.push(`About ${num(p.annualMiles)} miles a year is above most 12,000-mile lease allowances. Overage runs about $0.25 a mile.`);}
  else if(p.annualMiles<10000){Lp+=2;rl.push(`About ${num(p.annualMiles)} miles a year fits inside a standard lease allowance.`);}
  if(p.keep==="6plus"){F+=3;rf.push("You plan to keep it a long time. The years after the loan is paid off are where owning saves money.");}
  else if(p.keep==="under3"){Lp+=2.5;rl.push("You expect to change cars within 3 years, which is what a lease is built for.");}
  if(p.credit<660){F+=1.5;rf.push("At this credit level, lease approvals get harder and pricier.");}
  if(L.cond!=="new"){F+=5;rf.push("Leases are for new cars, so this one would be financed.");}
  if(L.model.pt==="bev"){Lp+=2;rl.push("EV prices and battery tech are moving fast. A lease leaves that resale risk with the lender.");}
  if(p.rough){F+=1;rf.push("Rough roads add wear-and-tear charges when a lease ends.");}
  if(!rf.length) rf.push("Financing builds equity and has no mileage limit.");
  return {rec:F>=Lp?"finance":"lease",reasons:F>=Lp?rf:rl};
}
function costsFor(L,p){
  const st=structure(L,p);
  let q=st.rec==="lease"?leaseQuote(L,p):null;
  if(!q){q=financeQuote(L,p);st.rec="finance";}
  const energy=energyCost(L.model,p), insurance=insuranceCost(L,p), reserve=repairReserve(L,p);
  return {quote:q,structure:st,payment:q.payment,energy,insurance,reserve,total:q.payment+energy+insurance+reserve};
}

/* ---------- filters (model-level needs, then listing-level guardrails and filters) ---------- */
function modelFilter(m,p,ev){
  if(m.seats<p.seatsNeed) return `Seats ${m.seats}; you need ${p.seatsNeed}.`;
  if(p.tow&&m.tow<p.tow) return m.tow?`Tows about ${lbkg(m.tow)}; you need ${lbkg(p.tow)}.`:`Not rated to tow; you need ${lbkg(p.tow)}.`;
  if(p.traction==="4wdreq"&&!m.fourwd) return "You need 4WD, and this doesn't offer it.";
  if(p.traction==="awdreq"&&!m.awd) return "You need all-wheel drive, and this doesn't offer it.";
  if(p.rough&&m.clear<7) return `Too low for regular rough roads (about ${m.clear} in of clearance).`;
  if(m.pt==="bev"&&ev.score<.30) return "Your charging situation can't realistically support a full EV.";
  if(m.pt==="bev"){
    const usable=m.range*(p.local.climate==="severe"?.65:p.local.climate==="cold"?.75:.85);
    if(usable<p.daily) return `Usable winter range (about ${Math.round(usable)} mi) is short of your ${p.daily}-mile day.`;
  }
  return null;
}
const FILTER_DEFAULTS={cond:"any",year:0,miles:0,seller:"any",warranty:"any"};
function listingFilter(L,p,f){
  if(L.price>CEILING.price) return "guard";
  if((p.traction==="awdreq"||p.traction==="4wdreq")&&!L.awd) return "awd";
  if(L.age>p.guard.age||L.miles>p.guard.miles) return "guard";
  if(f.cond==="new"&&L.cond!=="new") return "filter";
  if(f.cond==="used"&&L.cond==="new") return "filter";
  if(f.year&&L.year<f.year) return "filter";
  if(f.miles&&L.miles>f.miles) return "filter";
  if(f.seller==="dealer"&&L.seller!=="dealer") return "filter";
  if(f.warranty==="some"&&L.warranty==="none") return "filter";
  if(f.warranty==="cpo"&&!(L.warranty==="cpo"||L.warranty==="factory")) return "filter";
  return null;
}

/* ---------- the 100-point needs score + experience fit ---------- */
const MAX={afford:25,today:18,future:18,driving:14,energy:10,practical:10,service:3,maker:2};
const PART_LABEL={afford:"Affordability",today:"Fit today",future:"Future readiness",driving:"Driving pattern",energy:"Energy access",practical:"Practicality",service:"Service + reliability",maker:"Manufacturer tie-break"};

function scoreListing(L,p,ctx){
  const m=L.model, c={}, costs=costsFor(L,p), bud=ctx.bud;
  // Affordability: only a car inside the working budget can earn full marks.
  const r=costs.total/Math.max(bud.target,1);
  const af=r<=.85?1:r<=1?1-(r-.85)/.15*.2:r<=1.2?.8-(r-1)/.2*.5:Math.max(0,.3-(r-1.2)/.3*.3);
  c.afford=af*25;
  // Fit today
  const extra=m.seats-p.seatsNeed;
  const seatPts=extra<=1?6:extra===2?5:3.5;
  const rearPts=p.childSeats>0?4*m.rear:4;
  const cargoNeed=Math.max(...p.cargo.map(x=>CARGO_NEED[x]||12));
  const cargoPts=5*Math.min(1,m.cargo/cargoNeed);
  let accessPts=3;
  if(p.access==="high") accessPts=m.step==="high"?3:1;
  else if(p.access==="low") accessPts=m.step==="low"?3:m.step==="normal"?2:.8;
  else if(p.access==="mobility") accessPts=m.body==="minivan"?3:(m.size==="L"&&m.body!=="truck")?2:.6;
  c.today=seatPts+rearPts+cargoPts+accessPts;
  // Future readiness: will it survive the life the buyer expects next?
  const fh=p.keep==="6plus"?.55+.45*m.rel:p.keep==="under3"||p.areaStay==="under2"?.7+.3*(1-m.dep):.75+.25*m.rel;
  let fut=fh; const fparts=[]; let babyF=null;
  if(p.changes.length){
    const wt=p.changeWhen==="within1"?1:p.changeWhen==="1to2"?.85:.6;
    for(const ch of p.changes){
      let f=1;
      if(ch==="baby"){const need=Math.max(p.pax,p.childSeats+2);f=(m.seats>=need?1:.2)*.4+Math.min(1,m.cargo/25)*.35+m.rear*.25;babyF=f;}
      else if(ch==="partner") f=m.seats>=4?1:.35;
      else if(ch==="move") f=(m.pt==="bev"?.6:.95)*(.6+.4*m.rel);
      else if(ch==="contract") f=1-m.dep*.6;
      else if(ch==="retire") f=(m.step==="normal"?1:m.step==="high"?.9:.75)*(.75+.25*m.lux);
      fparts.push(1-(1-f)*wt);
    }
    fut=.4*fh+.6*(fparts.reduce((a,b)=>a+b,0)/fparts.length);
  }
  c.future=fut*18;
  // Driving pattern
  let ds;
  if(m.pt==="bev"){
    const usable=m.range*(p.local.climate==="severe"?.65:p.local.climate==="cold"?.75:.85);
    ds=(.5+.5*Math.min(1,usable/(p.daily*2)))*({rare:1,few:.85,monthly:.6}[p.trips]);
  } else if(m.pt==="hybrid") ds=ctx.hyb;
  else if(m.pt==="phev") ds=ctx.phev;
  else ds=ctx.ice*(p.annualMiles>15000?(m.mpg>=30?1:m.mpg>=25?.9:.8):1);
  c.driving=ds*14;
  // Energy access
  let e=1;
  if(m.pt==="bev") e=p.l2?1:p.home&&p.charger==="landlord"?.8:p.home?.6:p.sleeps==="aptcharge"?.75:p.workCharge==="yes"?.55:p.local.chargers10>=40?.35:.15;
  else if(m.pt==="phev") e=p.home?1:p.sleeps==="aptcharge"?.8:.35;
  else e=p.local.gas5>=3?1:.8;
  c.energy=e*10;
  // Practicality: traction, parking, clearance
  let t=1;
  const awd=L.awd;
  if(p.snow||p.rough) t=awd?1:(p.traction==="fwd"?.9:.5);
  else if(p.traction==="awdpref") t=awd?1:.6;
  const tight=p.parking==="tight"||p.parking==="street";
  const pk=tight?{S:1,M:.7,L:.3}[m.size]:p.parking==="garage"?(m.size==="L"?.7:1):1;
  const rg=p.rough?(m.clear>=8.5?1:m.clear>=7.5?.7:.4):1;
  c.practical=4*t+3*pk+3*rg;
  // Service + reliability, then a 2-point manufacturer tie-break
  const svc=m.dealer*(p.place==="rural"&&m.dealer<.6?.5:1)*(p.local.dealers25<4?.85:1);
  c.service=m.rel*2+svc;
  c.maker=(m.rel*.6+m.dealer*.4)*2;
  const needs=Object.values(c).reduce((a,b)=>a+b,0);
  // Experience fit: wants only
  const bodyS=!p.bodies.length?.7:p.bodies.includes(m.body)?1:.25;
  const ptS=!p.pts.length?.7:p.pts.includes(m.pt)?1:.3;
  const featS=!p.feats.length?.7:p.feats.filter(x=>m.feats.includes(x)).length/p.feats.length;
  const purS={dependable:m.rel,practical:(m.fun+m.rel)/2,performance:m.perf,luxury:m.lux,weekend:m.fun,
    work:Math.min(1,m.tow/7000*.6+m.cargo/50*.4)}[p.purpose];
  const exp=(bodyS*35+ptS*20+featS*25+purS*20)/100;
  // Over-budget cars also lose ground in the overall ranking, so a car well past the
  // working budget can't be called the best fit. Inside the budget nothing changes.
  const pen=r<=1?1:Math.max(.4,1-(r-1)*.6);
  const overall=(needs*.8+exp*100*.2)*pen;
  return {L,m,c,needs,exp,overall,costs,overBudget:r>1,babyF,awd};
}

/* ---------- plain-language reasons ---------- */
function reasonsFor(s,p,bud){
  const m=s.m, c=s.c, why=[], watch=[];
  const ratio=k=>c[k]/MAX[k];
  // The budget verdict lives on the cost sticker, so it isn't repeated in these lines.
  if(p.changes.includes("baby")){
    if(s.babyF>=.85) why.push("Ready for a growing family: rear-seat access and stroller room.");
    else watch.push("Gets tight once a baby and a stroller arrive.");
  } else if(p.changes.includes("contract")||p.areaStay==="under2"){
    if(m.dep<=.4) why.push("Holds its value well, which matters on a short horizon.");
    else watch.push("Loses value quickly, which hurts if you sell within 2 years.");
  } else if(p.keep==="6plus"&&m.rel>=.85) why.push(`Strong reliability for the 6-plus years you plan to keep it.`);
  if(p.childSeats>0&&m.rear>=.8) why.push(`Easy rear-seat access for ${p.childSeats} child seat${p.childSeats>1?"s":""}.`);
  if(m.pt==="hybrid"&&p.annualMiles>=10000) why.push(`Hybrid efficiency suits about ${num(p.annualMiles)} miles a year.`);
  if(m.pt==="bev"&&p.l2) why.push("You'd charge at home and start most days full.");
  if(m.pt==="bev"&&!p.home&&p.sleeps!=="aptcharge") watch.push("Charging would be mostly public, about a 30–40 minute stop each week.");
  if((p.snow||p.rough)&&s.awd) why.push(p.rough?"All-wheel drive and clearance for rough roads.":"All-wheel drive for your snow and ice.");
  if((p.snow||p.rough)&&!s.awd) watch.push("No all-wheel drive. Winter tires help, but it isn't ideal.");
  if(p.tow&&m.tow>=p.tow) why.push(`Tows up to ${lbkg(m.tow)}, enough for your ${lbkg(p.tow)}.`);
  const tight=p.parking==="tight"||p.parking==="street";
  if(tight&&m.size==="S") why.push("Small enough for tight parking.");
  if(tight&&m.size==="L") watch.push("Big for the tight spots you park in.");
  if(m.seats-p.seatsNeed>=3) watch.push(`Seats ${m.seats} when you need ${p.seatsNeed}, so you'd pay to carry empty space.`);
  const cargoNeed=Math.max(...p.cargo.map(x=>CARGO_NEED[x]||12));
  if(m.cargo<cargoNeed*.9) watch.push("Cargo space is tight for what you need to carry.");
  if(!why.length){
    const best=["today","practical","service","driving"].sort((a,b)=>ratio(b)-ratio(a))[0];
    why.push({today:"Covers your seats and cargo today.",practical:"Easy to live with where you drive and park.",
      service:"A dependable record with plenty of service nearby.",driving:"A good match for how much you drive."}[best]);
  }
  if(!watch.length) watch.push(m.watch);
  return {why:why.slice(0,3),watch:watch[0]};
}

/* ---------- the plan ---------- */
function buildPlan(A,filters){
  const p=makeProfile(A), bud=budget(p), ev=evFeas(p);
  const f=Object.assign({},FILTER_DEFAULTS,filters||{});
  const ctx={p,bud,ev,hyb:hybridFit(p),phev:phevFit(p),ice:iceFit(p)};
  const fits=[], ruled=[];
  const farLimit=(bud.stretch!=null?Math.max(bud.stretch,bud.target):bud.target*1.2)*1.35;
  for(const m of MODELS){
    const mr=modelFilter(m,p,ev);
    if(mr){ruled.push({m,reason:mr,kind:"need"});continue;}
    if(!m.listings.length){ruled.push({m,reason:"None for sale near you right now.",kind:"filter"});continue;}
    const ok=[]; let guard=0, filt=0, over=[];
    for(const L of m.listings){
      const lf=listingFilter(L,p,f);
      if(lf==="guard"){guard++;continue;} if(lf==="filter"){filt++;continue;} if(lf==="awd"){continue;}
      const s=scoreListing(L,p,ctx);
      if(s.costs.total>farLimit){over.push(s.costs.total);continue;}
      ok.push(s);
    }
    if(!ok.length){
      let reason, kind="budget";
      if(over.length) reason=`Roughly ${money(Math.min(...over))} a month all-in, far beyond your budget.`;
      else if(filt){reason="No listings match your filters right now.";kind="filter";}
      else if(!guard){reason="None of these listings has the all-wheel drive you need.";kind="need";}
      else {reason=`Every listing is outside your ${p.guard.age}-year, ${num(p.guard.miles)}-mile guardrail.`;kind="guard";}
      ruled.push({m,reason,kind});continue;
    }
    ok.sort((a,b)=>b.overall-a.overall);
    const best=ok[0]; best.options=ok.slice().sort((a,b)=>a.costs.total-b.costs.total);
    fits.push(best);
  }
  fits.sort((a,b)=>b.overall-a.overall);
  fits.forEach((s,i)=>{s.rank=i+1;Object.assign(s,reasonsFor(s,p,bud));});

  // Three valid paths, not one winner.
  const picks=[];
  const top=fits[0];
  if(top){
    picks.push({tag:"Best overall fit",s:top});
    const cheap=fits.filter(x=>x!==top&&x.needs>=Math.max(60,top.needs-15)&&x.costs.total<top.costs.total-25)
      .sort((a,b)=>a.costs.total-b.costs.total)[0];
    if(cheap) picks.push({tag:"Lowest monthly cost",s:cheap});
    const fun=fits.filter(x=>!picks.some(k=>k.s===x)&&x.needs>=Math.max(55,top.needs-20)&&x.costs.total<=bud.target&&x.exp>top.exp+.02&&x.c.energy>=5&&x.c.practical>=6)
      .sort((a,b)=>b.exp-a.exp)[0];
    if(fun) picks.push({tag:"More enjoyable, inside your budget",s:fun});
    for(const x of fits){ if(picks.length>=3) break; if(!picks.some(k=>k.s===x)) picks.push({tag:"Also a strong fit",s:x}); }
  }
  const within=fits.filter(x=>x.costs.total<=bud.target).length;

  // The "do nothing" answer.
  let keep=null;
  if(p.hasCar&&p.role==="replace"&&p.covers!=="no"){
    const basis=Math.max(p.curPayment, top?top.costs.payment:0, 1);
    const months=p.repairCost/basis;
    const favored=p.covers==="yes"?p.timing!=="now":months<=8;
    keep={favored,repair:p.repairCost,months,basis,
      text:p.covers==="yes"
        ?`Your car can cover the next year. Keeping it while you save a bigger down payment avoids about ${money(top?top.costs.total:0)} a month in new costs.`
        :`The ${money(p.repairCost)} repair equals about ${Math.max(1,Math.round(months))} month${Math.round(months)===1?"":"s"} of the new car's ${money(basis)} payment. ${months<=8?"That usually makes repairing and keeping it the cheaper path.":"At that size, replacing it deserves a serious look."}`};
  }

  // Exit before entry.
  let route;
  if(keep&&keep.favored) route={key:"keep",title:"Keep and revisit",text:"Repair or keep driving what you have, and set a trigger: a repair over 8 months of payments, a life change, or a down payment target."};
  else if(p.areaStay==="under2"||(p.changes.includes("contract")&&p.keep==="under3")) route={key:"flex",title:"Stay flexible",text:"A short horizon makes a long loan risky. Compare a lease takeover, a subscription, or a cheaper used car you resell."};
  else if(top){
    const st=top.costs.structure;
    if(st.rec==="lease") route={key:"lease",title:"Lease for 36 months",text:st.reasons[0]};
    else if(p.keep==="under3") route={key:"finance",title:"Finance, then resell",text:top.L.cond==="new"?"You'll change cars within 3 years. Pick a model that holds its value, since the first years carry the biggest loss.":"You'll change cars within 3 years. A car that has already taken its biggest depreciation hit resells with less loss."};
    else route={key:"finance",title:"Finance and keep it",text:st.reasons[0]};
  }

  // Ready for what's next?
  let next;
  if(top){
    if(p.changes.includes("baby")){
      const alt=fits.find(x=>x!==top&&x.babyF>=.85);
      next=top.babyF>=.85?{title:"Baby-ready",text:"Room for another child seat and a stroller without trading up."}
        :{title:"Tight when the baby comes",text:alt?`Today's pick gets cramped with a stroller. The ${alt.m.make} ${alt.m.model} (#${alt.rank}) handles it better.`:"Today's pick gets cramped with a stroller, so plan to trade up then."};
    }
    else if(p.changes.includes("move")) next={title:"Ready for a new commute",text:"Reliable and efficient enough if your miles change after the move."};
    else if(p.changes.includes("contract")||p.areaStay==="under2") next={title:"Easy to exit",text:"Plan to resell or hand it back when the job or the stay ends."};
    else if(p.changes.includes("partner")) next={title:"Room for two",text:"Comfortable for a partner and the occasional guest."};
    else if(p.changes.includes("retire")) next={title:"Comfortable for retirement",text:"Easy to get in and out of, with low running costs."};
    else next={title:"Built for today",text:`No big change planned, so it's matched to the ${p.keep==="6plus"?"6-plus":p.keep==="under3"?"next 3":"3–5"} years you'll keep it.`};
  }

  // Where the wanted car (or the curious powertrain) landed.
  let spotlight=null;
  const place=pred=>{
    const i=fits.findIndex(x=>pred(x.m));
    if(i>=0) return {s:fits[i],rank:i+1};
    const r=ruled.find(x=>pred(x.m)); return r?{ruled:r}:null;
  };
  if(p.mode==="test"&&p.wantCar){
    const m=MODELS.find(x=>x.id===p.wantCar);
    if(m) spotlight={label:`${m.make} ${m.model}`,want:true,...place(x=>x.id===m.id)};
  } else if(p.pts.length&&top&&!picks.some(k=>p.pts.includes(k.s.m.pt))){
    const pt=p.pts[0];
    spotlight={label:PT_LABEL[pt].toLowerCase(),want:false,pt,...place(x=>x.pt===pt)};
  } else if(p.bodies.length&&top&&!picks.some(k=>p.bodies.includes(k.s.m.body))){
    const b=p.bodies[0];
    spotlight={label:(BODY_LABEL[b]||b).toLowerCase(),want:false,body:b,...place(x=>x.body===b)};
  }
  if(spotlight&&spotlight.s){
    const s=spotlight.s, lost=Object.keys(MAX).map(k=>({k,miss:MAX[k]-s.c[k]})).sort((a,b)=>b.miss-a.miss);
    spotlight.held=lost.slice(0,2).filter(x=>x.miss>=2.5).map(x=>holdText(x.k,s,p,bud,ev));
  }

  return {p,bud,ev,fits,ruled,picks,within,keep,route,next,spotlight,filters:f};
}
function holdText(k,s,p,bud,ev){
  const m=s.m;
  switch(k){
    case "afford": return s.costs.total>bud.target?`It runs about ${money(s.costs.total)} a month all-in, ${money(s.costs.total-bud.target)} over your working budget.`:"It costs more to run than the cars above it.";
    case "energy": return m.pt==="bev"?(ev.blockers[0]||"Charging access is limited where you live."):"Fuel access is limited nearby.";
    case "future": return p.changes.includes("baby")?"It gets cramped once a baby and a stroller arrive.":"It's a weaker match for how long you plan to keep it.";
    case "today": return s.m.seats-p.seatsNeed>=3?`It seats ${m.seats} when you need ${p.seatsNeed}.`:"Rear-seat access or cargo space falls short of what you carry.";
    case "driving": return m.pt==="bev"?"Your long trips would need regular charging stops.":"Its powertrain is a weaker match for your miles.";
    case "practical": return (p.snow||p.rough)&&!s.awd?"No all-wheel drive for your conditions.":"It's a tougher fit for where you park.";
    case "service": return "Reliability and service coverage near you are weaker.";
    default: return "Its manufacturer tie-break is lower, a 2-point factor.";
  }
}

/* Live listings from the site's own server function (auto.dev data). Each row is matched to a
   catalog model, so the fit score still uses FitDrive's specs for that model. */
function liveToListing(r,m){
  const year=+r.year||YEAR, age=Math.max(0,YEAR-year), cond=!r.used?"new":r.cpo?"cpo":"used";
  const miles=cond==="new"?Math.max(0,+r.miles||0):Math.max(0,+r.miles||0);
  const dt=String(r.drivetrain||"");
  const awd=dt?/awd|4wd|4x4|all|four/i.test(dt):(m.awd&&(!m.awdFrom||year>=m.awdFrom));
  const warranty=cond==="new"?"factory":cond==="cpo"?"cpo":(age<=5&&miles<60000?"powertrain":"none");
  const vin=String(r.vin||"");
  return {id:"live-"+vin.replace(/[^A-Za-z0-9]/g,""),model:m,year,age,miles,awd,cond,seller:"dealer",warranty,price:Math.round(+r.price||0),
    dist:null,where:r.dealer||"Dealer",city:r.city||"",state:r.state||"",vin:vin.slice(-4),fullVin:vin,trim:r.trim||"",url:r.vdp||"",
    photo:r.photo||"",carfax:r.carfax||"",createdAt:r.createdAt||null,live:true};
}
function setLive(rows){
  MODELS.forEach(m=>{m.listings=[];});
  const seen=new Set();
  (rows||[]).forEach(r=>{const m=MODELS.find(x=>x.id===r.modelId);if(!m||!r.vin||!(+r.price>0)||seen.has(r.vin))return;seen.add(r.vin);m.listings.push(liveToListing(r,m));});
  ALL_LISTINGS=MODELS.flatMap(m=>m.listings);
  return ALL_LISTINGS.length;
}
function setDemo(){MODELS.forEach(m=>{m.listings=m.demoListings;});ALL_LISTINGS=MODELS.flatMap(m=>m.listings);}

// Typical factory coverage by brand: [basic years, basic miles, powertrain years, powertrain miles].
// Hyundai and Kia's 10-year powertrain applies to the first owner; later owners get 5 years / 60,000 miles.
const COVERAGE={Toyota:[3,36000,5,60000],Lexus:[4,50000,6,70000],Honda:[3,36000,5,60000],Nissan:[3,36000,5,60000],
  Mazda:[3,36000,5,60000],Subaru:[3,36000,5,60000],Ford:[3,36000,5,60000],Chevrolet:[3,36000,5,60000],
  Hyundai:[5,60000,10,100000],Kia:[5,60000,10,100000],Tesla:[4,50000,8,100000],BMW:[4,50000,4,50000]};
function coverageFor(L,p){
  const m=L.model, c=COVERAGE[m.make]||[3,36000,5,60000];
  let [by,bm,py,pm]=c;
  if((m.make==="Hyundai"||m.make==="Kia")&&L.cond!=="new"){py=5;pm=60000;}
  const perYear=Math.max(p.annualMiles||12000,1);
  const left=(y,mi)=>{const yl=y-L.age, ml=mi-L.miles; if(yl<=0||ml<=0) return 0; return Math.min(yl,ml/perYear);};
  const items=[{k:"Basic warranty",y:by,mi:bm,left:left(by,bm)},{k:"Powertrain",y:py,mi:pm,left:left(py,pm)}];
  if(m.pt==="hybrid"&&(m.make==="Toyota"||m.make==="Lexus")) items.push({k:"Hybrid battery",y:10,mi:150000,left:left(10,150000)});
  else if(m.pt==="hybrid") items.push({k:"Hybrid battery",y:8,mi:100000,left:left(8,100000)});
  if(m.pt==="bev"||m.pt==="phev") items.push({k:"EV battery",y:8,mi:100000,left:left(8,100000)});
  const keepYears={under3:3,"3to5":5,"6plus":7}[p.keep]||5;
  const basicLeft=items[0].left;
  return {items,keepYears,basicLeft,cpo:L.cond==="cpo"};
}
function yearsText(y){
  if(y<=0) return "Expired";
  if(y<1) return `About ${Math.max(1,Math.round(y*12))} months`;
  const r=Math.round(y*2)/2;
  return `About ${r} year${r===1?"":"s"}`;
}
// Typical asking price for the same model, year and mileage (the demo's version of "similar listings").
function typicalPrice(L){
  const m=L.model; let p=m.price;
  if(L.age>0){p*=Math.pow(1-m.dep,L.age/5); const exp=12000*L.age; p*=1-clamp((L.miles-exp)/exp*.15,-.04,.08);}
  if(L.seller==="private") p*=.94;
  return Math.round(p/10)*10;
}
function dealCheck(L){
  if(L.live){
    const peers=L.model.listings.filter(x=>x!==L&&x.cond===L.cond&&Math.abs(x.year-L.year)<=1).map(x=>x.price).sort((a,b)=>a-b);
    const typ=peers.length>=2?peers[Math.floor(peers.length/2)]:null, diff=typ==null?0:L.price-typ;
    const dom=L.createdAt?Math.max(0,Math.round((Date.now()-new Date(L.createdAt).getTime())/864e5)):null;
    const rating=typ==null?"Not enough to compare":diff<=-typ*.025?"Good price":diff>=typ*.025?"Priced high":"Fair price";
    return {typ,diff,dom,dropped:0,dropDays:0,rating,peers:peers.length,live:true};
  }
  const typ=typicalPrice(L), diff=L.price-typ;
  const dom=3+Math.floor(hash(L.id+"dom")*55);
  const dropped=hash(L.id+"drop")<.35?Math.round((150+hash(L.id+"amt")*900)/50)*50:0;
  const rating=diff<=-typ*.025?"Good price":diff>=typ*.025?"Priced high":"Fair price";
  return {typ,diff,dom,dropped,dropDays:dropped?2+Math.floor(hash(L.id+"dd")*20):0,rating};
}
// How loaded: a 1–10 demo rating from the feature list and how upscale the cabin is.
function loadedScore(m){return clamp(Math.round(m.feats.length*1.1+m.lux*4),1,10);}
function relScore(m){return Math.round(m.rel*100)/10;}
function fiveYearCost(L,p){
  const q=financeQuote(L,p,60), ins=insuranceCost(L,p), en=energyCost(L.model,p), res=repairReserve(L,p);
  const resale=L.price*(1-L.model.dep);
  const total=p.down+Math.max(0,p.equity)+q.payment*60+(ins+en+res)*60-resale;
  return {total,resale,payment:q.payment};
}
// Example complaint layout. NOT real data: the live version groups NHTSA owner complaints by area.
function complaintsExample(m){
  const areas=["Electrical system","Engine","Brakes","Suspension","Steering","Air bags","Power train","Visibility"];
  return areas.map(a=>({a,n:Math.round(4+hash(m.id+a)*60)})).sort((x,y)=>y.n-x.n).slice(0,5);
}
// Monthly charging cost by where the buyer charges most of the time.
function chargingScenarios(L,p){
  const m=L.model; if(m.pt!=="bev"&&m.pt!=="phev") return null;
  const R=localRates(p);
  const opts=[{k:"home",label:"Home charger",note:"Level 2, in a garage or driveway",share:.9},
    {k:"outlet",label:"Regular home outlet",note:"Level 1, the cord that comes with the car",share:.85},
    {k:"public",label:"Public chargers only",note:"No place to plug in at home",share:.1}];
  opts.forEach(o=>{o.cost=energyCost(m,p,o.share);});
  const def=p.l2?"home":p.home?"outlet":p.sleeps==="aptcharge"?"home":"public";
  return {opts,def,R,il:/^6[0-2]\d\d\d$/.test(p.zip||""),comed:/^60[0-6]\d\d$/.test(p.zip||"")};
}

/* ---------- questions ---------- */
function ledgerData(){
  const a=S.A, p=makeProfile(a), b=budget(p), f=[], ins=[];
  if(a.mode) f.push(["Approach",a.mode==="test"?(a.wantCar?`Testing the ${carName(a.wantCar)}`:"Testing a car you want"):"Brand-blind"]);
  if(a.hasCar) f.push(["Current car",a.hasCar==="no"?"None":p.role==="extra"?"Keeping it":"May replace it"]);
  if(a.purpose) f.push(["Purpose",optLabel("purpose",a.purpose)]);
  if(a.household) f.push(["Serves",optLabel("household",a.household)+(p.childSeats?`, ${p.childSeats} child seat${p.childSeats>1?"s":""}`:"")]);
  if(a.changes) f.push(["Coming up",p.changes.length?p.changes.map(c=>optLabel("changes",c).replace(/^An? /,"")).join("; "):"No big change"]);
  if(a.commute!==undefined||S.visited.includes("commute")) f.push(["Miles a year",`About ${num(p.annualMiles)}`]);
  if(p.local.known) f.push(["Nearby (demo data)",`${p.local.chargers10} chargers, ${p.local.shops15} repair shops`]);
  if(a.sleeps) f.push(["Home charging",p.l2?"240V at home":p.home&&p.charger==="landlord"?"Needs landlord OK":p.home?"Regular outlet":a.sleeps==="aptcharge"?"Building chargers":p.workCharge==="yes"?"At work only":"Public only"]);
  if(a.payment){f.push(["Payment, then all-in",`${money(a.payment)} → ${money(b.statedAllIn)}`]); if(b.comfortable!=null) f.push(["Income supports",`${money(b.comfortable)}/mo`]);}
  if(a.pax!==undefined) f.push(["Seats needed",String(p.seatsNeed)]);
  if(a.tow) f.push(["Towing",lbkg(a.tow)]);
  if(a.mode==="test"&&a.wantCar) ins.push(`The ${carName(a.wantCar)} is set aside. FitDrive tests it honestly at the end.`);
  if(a.hasCar==="yes"&&a.covers==="yes"&&p.role!=="extra") ins.push("Keeping your car is on the table, and FitDrive will compare it fairly.");
  if(a.covers==="repairs") ins.push("A repair smaller than about 8 months of payments usually favors keeping the car.");
  if(a.role==="extra") ins.push("A second car covers the awkward trips, the biggest EV de-risker there is.");
  if(["performance","weekend","luxury"].includes(a.purpose)) ins.push("Enjoyment counts. It just can't outvote the budget.");
  if(p.changes.includes("baby")) ins.push("FitDrive will check rear-seat access and stroller room, not only today's fit.");
  if(p.changes.includes("contract")||a.areaStay==="under2") ins.push("Short horizon. Leases and resale value get extra weight so you don't buy twice.");
  if(a.other){if(p.annualMiles>15000) ins.push(`About ${num(p.annualMiles)} miles a year is above most lease allowances, so financing is likely safer.`); else if(p.annualMiles<8000) ins.push("Low mileage. Fuel savings won't repay a big hybrid or EV premium.");}
  if(a.sleeps==="street") ins.push(a.workCharge==="yes"?"No home charging, but work charging keeps an EV realistic.":"No home charging. EVs get much harder, and hybrids move up.");
  if(a.sleeps&&p.l2) ins.push("Home charging is the single biggest EV advantage, and you have it.");
  if(a.conditions&&(p.snow||p.rough)) ins.push("All-wheel drive gets extra weight. Good tires still matter more than the badge.");
  if(a.payment) ins.push(`A ${money(a.payment)} payment is closer to ${money(b.statedAllIn)} a month once fuel, insurance and upkeep are counted.`);
  if(a.payment&&b.comfortable!=null&&b.statedAllIn>b.comfortable) ins.push(`That's above the ${money(b.comfortable)} your income comfortably supports, so FitDrive plans around ${money(b.comfortable)}.`);
  if(a.credit&&a.credit<660) ins.push("At this credit level lease approvals get harder, so financing is likely.");
  if(a.pax!==undefined&&p.seatsNeed>=6) ins.push(`At least ${p.seatsNeed} seats. Anything smaller is ruled out.`);
  if(a.tow) ins.push(`Towing ${lbkg(a.tow)} rules out most cars. That's expected.`);
  return {f,ins:ins.slice(-3),as:assumptions()};
}

    <section class="section" aria-labelledby="hist-h"><h2 id="hist-h">History and recalls</h2>
      <div class="grid3"><div class="box"><h3>Vehicle history report</h3>${L.carfax?`<p>The dealer offers a free Carfax report for this car.</p><a href="${esc(L.carfax)}" target="_blank" rel="noopener">Open the Carfax report</a>`:`<p>Accidents, owners and service records${L.live?". Ask the dealer for a Carfax or AutoCheck report.":", from a Carfax or AutoCheck partner in the live version."}</p>`}</div>

        <div class="box"><h3>Recalls</h3><p>The live version lists every NHTSA recall for the ${L.year} ${esc(m.make+" "+m.model)}. Ask the seller to confirm each is fixed. After you buy, FitDrive keeps watching for new ones.</p><a href="https://www.nhtsa.gov/recalls" target="_blank" rel="noopener">Check any VIN at NHTSA</a></div></div></section>

/* ---------- request ---------- */
function reqState(L){if(!S.req[L.id]) S.req[L.id]={type:"drive",day:1,time:"Morning",contact:"Email",inspect:L.cond!=="new",otd:true,share:true,consent:false,sent:false,err:""};return S.req[L.id];}
function dayLabel(i){const d=new Date();d.setDate(d.getDate()+i+1);return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});}
function askHTML(){
  const L=listingById(S.carId); if(!L) return "";
  const p=prof(), c=costsFor(L,p), r=reqState(L), f=fitFor(L), seller=L.seller==="private"?"the seller":esc(L.where);
  const types=[["check","Check it's still there","A quick yes or no"],["drive","Book a test drive","Pick a day and time"],["hold","Ask them to hold it","The seller decides; any deposit is with them"]];
  const needs=PLAN?[`${PLAN.p.seatsNeed} seats`,PLAN.p.snow?"AWD for snow":null,PLAN.p.parking==="street"?"street parking":null].filter(Boolean).join(", "):"Not shared yet";
  const chip=(k,v,label,on)=>`<button type="button" class="chip${on?" on":""}" data-req="${k}" data-v="${v}" aria-pressed="${on}">${label}</button>`;
  if(r.sent) return `<nav class="crumbs" aria-label="Breadcrumb"><button type="button" data-go="car-${L.id}">${esc(lname(L))}</button><span aria-hidden="true">›</span><span>Request sent</span></nav>
    <div class="stack"><header class="plan-head"><span class="eyebrow blue">${LIVE?"Test version: nothing was sent yet":"Demo: nothing was sent"}</span><h1 id="pagetitle" tabindex="-1">Request ready for ${seller}</h1><p>In the live version this goes straight into the dealer's lead system, and replies show up under Saved. Here's how it would be tracked.</p></header>
    <section class="section"><ol class="timeline"><li class="done"><span class="k">1 · Sent</span><b>Request delivered</b><span>Just now</span></li><li><span class="k">2 · Confirmed</span><b>${r.type==="drive"?"Still available; time confirmed":r.type==="hold"?"Hold accepted or declined":"Yes or no on availability"}</b><span>Usually within 2 business hours</span></li>
      ${r.type==="drive"?`<li><span class="k">3 · Test drive</span><b>${dayLabel(r.day)}, ${r.time.toLowerCase()}</b><span>Reminder the evening before</span></li>`:""}<li><span class="k">${r.type==="drive"?4:3} · Did you buy it?</span><b>Your Garage</b><span>Recall alerts and reminders</span></li></ol>
      <div class="row"><button type="button" class="btn" data-go="car-${L.id}">Back to the car</button><button type="button" class="btn ghost" data-act="req-reset" data-id="${L.id}">Edit the request</button></div></section></div>`;
  return `<nav class="crumbs" aria-label="Breadcrumb"><button type="button" data-go="car-${L.id}">${esc(lname(L))}</button><span aria-hidden="true">›</span><span>Check availability</span></nav>
  <div class="cols"><form class="reqform main" id="reqform" data-id="${L.id}" novalidate>
    <div class="stack" style="gap:6px"><span class="eyebrow blue">Check availability</span><h1 id="pagetitle" tabindex="-1" style="font-size:clamp(28px,4vw,36px)">Ask ${seller} about this car</h1><p class="muted">Dealers usually reply within 2 business hours. ${LIVE?"Test version: requests aren't sent to dealers yet, and what you type isn't saved.":"Demo: what you type here isn't saved or sent."}</p></div>
    <fieldset><legend>What would you like?</legend><div class="opts c3">${types.map(t=>`<button type="button" class="opt${r.type===t[0]?" on":""}" data-req="type" data-v="${t[0]}" aria-pressed="${r.type===t[0]}"><span class="l">${t[1]}</span><span class="s">${t[2]}</span></button>`).join("")}</div></fieldset>
    ${r.type==="drive"?`<fieldset><legend>When works for you?</legend><div class="chips">${[0,1,2,3].map(i=>chip("day",i,dayLabel(i),r.day===i)).join("")}</div><div class="chips">${["Morning","Afternoon","Evening"].map(t=>chip("time",t,t,r.time===t)).join("")}</div><p class="hint">This is a request. ${L.seller==="private"?"The seller":"The dealer"} confirms the exact time.</p></fieldset>`:""}
    <div class="fields"><label for="rq-name">Your name<input id="rq-name" type="text" autocomplete="name" placeholder="First and last name"></label>
      <label for="rq-email">Email<input id="rq-email" type="email" autocomplete="email" placeholder="you@example.com"></label>
      <label for="rq-phone">Phone (optional)<input id="rq-phone" type="tel" autocomplete="tel" placeholder="(312) 555-0100"></label></div>
    <fieldset><legend>How should they reach you?</legend><div class="chips">${["Email","Text","Call"].map(t=>chip("contact",t,t,r.contact===t)).join("")}</div></fieldset>
    <fieldset><legend>Before I buy</legend>
      ${L.cond!=="new"?`<label class="check" for="rq-inspect"><input type="checkbox" id="rq-inspect" data-reqchk="inspect"${r.inspect?" checked":""}><span><b>I'd like an independent inspection.</b> I'll arrange it and pay for it; ${L.seller==="private"?"the seller":"the dealer"} just needs to agree. <button type="button" class="linkbtn" data-go="guide">How inspections work</button></span></label>`:""}
      <label class="check" for="rq-otd"><input type="checkbox" id="rq-otd" data-reqchk="otd"${r.otd?" checked":""}><span><b>Send me a written out-the-door price.</b> Price, tax, title, registration and every fee, itemized.</span></label></fieldset>
    <label class="check boxed" for="rq-share"><input type="checkbox" id="rq-share" data-reqchk="share"${r.share?" checked":""}><span><b>Include my FitDrive summary.</b> They see your needs and budget range, so you don't repeat yourself. Your income and credit answers are never shared.</span></label>
    <label class="check" for="rq-consent"><input type="checkbox" id="rq-consent" data-reqchk="consent"${r.consent?" checked":""}><span>Send my name and contact details to ${seller} so they can reply about this car, only by the method I picked. I can ask FitDrive to stop sharing at any time.</span></label>
    ${r.err?`<p class="err" role="alert">${esc(r.err)}</p>`:""}
    <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:16px"><span class="hint" style="max-width:30em">FitDrive doesn't take deposits, negotiate prices or sell cars. It passes your request to the seller.</span><button type="submit" class="btn">Send request</button></div>
  </form>
  <aside class="side"><div class="pricebox">${carArt(L)}<b class="big" style="font-size:22px">${esc(lname(L))}</b><span class="hint">${condLabel[L.cond]} · ${milesText(L)} · ${distText(L)}</span><div class="kv"><div><span>Price</span><span>${money(L.price)}</span></div><div><span>All-in a month</span><span>${money(c.total)}</span></div>${f&&f.overall!=null?`<div><span>Fit for you</span><span>${Math.round(f.overall)}/100</span></div>`:""}</div></div>
    <div class="dealer-gets"><h2>What ${L.seller==="private"?"the seller":"the dealer"} receives</h2><p>${L.seller==="private"?"A message through FitDrive.":"Sent into the dealer's lead system, so it reaches a salesperson."}</p>
      <div class="kv"><div><span>Request</span><span>${r.type==="drive"?`Test drive, ${dayLabel(r.day)}, ${r.time.toLowerCase()}`:r.type==="hold"?"Hold request":"Availability check"}</span></div><div><span>Car</span><span>VIN ending ${L.vin}</span></div><div><span>Contact</span><span>${r.contact} only</span></div>
        ${r.share?`<div><span>Budget</span><span>About ${money(bud().target)}/mo all-in</span></div><div><span>Needs</span><span>${esc(needs)}</span></div>`:""}${r.inspect&&L.cond!=="new"?`<div><span>Inspection</span><span>Wants an independent one first</span></div>`:""}${r.otd?`<div><span>Price</span><span>Written out-the-door quote, please</span></div>`:""}</div></div></aside></div>`;
}

/* ---------- guide + how ---------- */
function guideHTML(){
  return `<div class="stack"><header class="plan-head"><span class="eyebrow blue">Buying guide</span><h1 id="pagetitle" tabindex="-1">Before you sign</h1><p>Ask the right questions, drive it properly, get it checked, read the paperwork, and know which numbers to hold on to.</p>
      <nav class="toc" aria-label="On this page">${[["g0","Questions to ask first"],["gd","On the test drive"],["g1","Get it inspected"],["gp","Paying for it"],["g2","Read the paperwork"],["g3","Tactics that work"],["g4","Where to stand firm"],["g5","Private sellers"]].map(x=>`<button type="button" class="tbtn" data-scroll="${x[0]}-s">${x[1]}</button>`).join("")}</nav></header>
    <section class="section" id="g0-s" aria-labelledby="g0"><h2 id="g0">Questions to ask before you go</h2><p class="muted">Call or email first. The answers decide whether the trip is worth it.</p>
      <ul class="plain"><li>Is it still for sale, and is the listed price before tax and fees?</li><li>Are there dealer add-ons already on it, and can they come off?</li><li>Are all recalls done? Can I see the service records?</li><li>Has it been in an accident, and is the title clean?</li><li>For a used car: can I take it for an independent inspection?</li><li>How many keys come with it?</li></ul></section>
    <section class="section" id="gd-s" aria-labelledby="gd"><h2 id="gd">On the test drive</h2><p class="muted">Give it 30 minutes, not 10. Drive it the way you'll really use it.</p>
      <div class="grid2"><div class="box"><h3>Before you drive</h3><p>Ask them not to warm it up, so you hear it start cold. Walk around it in daylight and look for mismatched paint, uneven gaps and tire wear on one edge.</p></div>
        <div class="box"><h3>On the road</h3><p>Take your commute, a highway on-ramp, a rough street and a parking lot. With the radio off, listen for clunks over bumps and squeals or grinding when braking.</p></div>
        <div class="box"><h3>Hands light on the wheel</h3><p>It should track straight and stop straight. A pull to one side, a shimmy or a soft pedal is worth asking about.</p></div>
        <div class="box"><h3>Try everything, then fit your life in it</h3><p>Windows, locks, heat and A/C, seat heaters, the screen, phone pairing, cameras and sensors. Bring the car seat, the stroller or the tallest passenger, and check that it fits where you park.</p></div></div>
      <p class="fine">After the drive, look at the dash with the engine running. Any warning light stays on the list for the inspection.</p></section>
    <section class="section" id="g1-s" aria-labelledby="g1"><h2 id="g1">Get it inspected</h2><p class="muted">For any used car, even a certified one, pay an independent mechanic to look it over before you buy. You arrange it and pay for it; the seller just has to agree. On a FitDrive request, tick "I'd like an independent inspection" so the seller knows from the start.</p>
      <div class="grid3"><div class="box"><h3>A shop near the seller</h3><p>Most dealers will let you drive it to a nearby shop. Call ahead and book a pre-purchase inspection.</p></div><div class="box"><h3>A mobile inspector</h3><p>They come to the car. Handy for private sellers, or a dealer too far away to visit twice.</p></div><div class="box"><h3>Your own mechanic</h3><p>Someone who already works on your cars and has no stake in the sale.</p></div></div>
      <div class="grid2"><div class="box" style="background:var(--ground)"><h3>What a good one checks</h3><p>Body and frame, engine and transmission, brakes and tires, electronics, a computer scan for fault codes, a road test and photos. For a hybrid or EV, ask for a battery health report.</p></div><div class="box" style="background:var(--ground)"><h3>What it costs</h3><p>Roughly $100 to $450, depending on how thorough it is.</p></div></div>
      <div class="note bad"><b>Red flag:</b> a seller who won't allow an inspection. Ask why, and be ready to walk away.</div></section>
    <section class="section" id="gp-s" aria-labelledby="gp"><h2 id="gp">Paying for it</h2>
      <div class="grid2"><div class="box"><h3>Get preapproved first</h3><p>A loan offer from your bank or credit union gives you a rate to beat before you ever sit down with a finance manager.</p></div>
        <div class="box"><h3>Decide your numbers at home</h3><p>Pick your down payment and loan length with the <button type="button" class="linkbtn" data-go="browse">payment calculator on any car</button>, so the monthly number isn't decided for you at the desk.</p></div>
        <div class="box"><h3>Don't stretch the loan to hit a payment</h3><p>Going from 60 to 72 or 84 months lowers the payment and raises the total interest. You can also owe more than the car is worth for longer.</p></div>
        <div class="box"><h3>If the dealer beats your rate</h3><p>Take it, then check the contract: the same price, the same term, and nothing added to make up the difference.</p></div></div></section>
    <section class="section" id="g2-s" aria-labelledby="g2"><h2 id="g2">Read the paperwork</h2><p class="muted">Ask for the buyer's order before you sit down to sign, and check it line by line.</p>
      <div class="kv"><div><span>Out-the-door price</span><span style="text-align:right;max-width:60%">Itemized, and close to FitDrive's estimate or your quote</span></div><div><span>Add-ons</span><span style="text-align:right;max-width:60%">Paint protection, nitrogen tires, VIN etching, "market adjustment." Ask for anything you didn't request to come off</span></div><div><span>Doc fee</span><span style="text-align:right;max-width:60%">Illinois caps it at $378 in 2026. Other states set their own rules</span></div><div><span>The loan</span><span style="text-align:right;max-width:60%">Rate, months and total of payments match what you agreed</span></div><div><span>Service plans and GAP</span><span style="text-align:right;max-width:60%">Optional, never a condition of the loan, and negotiable</span></div><div><span>VIN and mileage</span><span style="text-align:right;max-width:60%">Match the paperwork to the car itself</span></div></div></section>
    <section class="section" id="g3-s" aria-labelledby="g3"><h2 id="g3">Tactics that work</h2><div class="grid3">

function ssGet(k){try{const v=JSON.parse(sessionStorage.getItem(k)||"null");return v&&Date.now()-v.at<6*3600e3?v.rows:null;}catch(e){return null;}}
function ssSet(k,rows){try{sessionStorage.setItem(k,JSON.stringify({at:Date.now(),rows}));}catch(e){}}
async function fetchModel(zip,dist,id){
  const k=`fd-live-${zip}-${dist}-${id}`, c=ssGet(k); if(c) return c;
  for(let tries=0;tries<2;tries++){
    try{
      const r=await fetch(`/.netlify/functions/fitdrive-listings?zip=${zip}&distance=${dist}&model=${encodeURIComponent(id)}`);
      if(r.status===429){await new Promise(res=>setTimeout(res,1300));continue;}
      const j=await r.json(); if(!r.ok||!j.ok) throw new Error(j.error||("HTTP "+r.status));
      ssSet(k,j.listings||[]); return j.listings||[];
    }catch(e){if(tries) throw e;}
  }
  throw new Error("rate_limited");
}
function ensureLive(){
  if(!LIVE) return;
  const zip=liveZipValue();
  if(!zip){if(S.liveZip){setDemo();S.liveZip=null;S.liveKey=null;}S.liveState="nozip";return;}
  const dist=liveDistance(), ids=liveModels(), key=zip+"-"+dist+"-"+ids.join(".");
  if(S.liveKey===key) return;
  S.liveKey=key; S.liveState="loading"; S.liveDone=0; S.liveTotal=ids.length;
  const rows=[]; let failed=0, i=0;
  const worker=async()=>{while(i<ids.length){const id=ids[i++];
    try{const got=await fetchModel(zip,dist,id);got.forEach(x=>rows.push(Object.assign({},x,{modelId:id})));}catch(e){failed++;}
    if(S.liveKey!==key) return; S.liveDone++; const el=document.getElementById("live-progress"); if(el) el.textContent=`Checked ${S.liveDone} of ${S.liveTotal} models`;
    await new Promise(res=>setTimeout(res,250));}};
  Promise.all([worker(),worker(),worker()]).then(()=>{
    if(S.liveKey!==key) return;
    const n=setLive(rows); S.liveZip=zip; S.liveCount=n;
    if(n){S.liveState="ok";} else {setDemo();S.liveState=failed>=ids.length?"error":"empty";}
    render();
  });
}

  switch(d.act){
    case "ledger":S.ledgerOpen=!S.ledgerOpen;refreshLive();return;
    case "zipchange":delete S.A.zip;S.liveKey=null;setDemo();S.liveState="nozip";render();{const z=document.getElementById("zip-live");if(z)z.focus();}return;
    case "liveretry":S.liveKey=null;render();return;
    case "fb-send":{sendFeedback();return;}
    case "edit":S.idx=0;S.sample=null;go("questions");return;
    case "restart":S.A={};S.visited=[];S.idx=0;S.planBuilt=false;S.sample=null;S.filters={...FILTER_DEFAULTS};S.open={};S.calc={};S.charge={};go("questions");return;
    case "reset-filters":S.filters={...FILTER_DEFAULTS};render();return;
    case "reset-browse":S.browse={...BROWSE_DEFAULTS};render();return;
    case "saved":S.savedOpen=!S.savedOpen;S.langOpen=false;render();return;
    case "lang":S.langOpen=!S.langOpen;S.savedOpen=false;render();return;
    case "langclose":S.langNote=null;render();return;
    case "langvote":{const name=(LANGS.find(x=>x[0]===S.langNote)||[])[1];S.fb.notes.push({screen:"Language menu",lang:S.langNote,reaction:null,like:`Would use the ${name} version`,change:"",add:""});persist();render();toast("Noted in your feedback");return;}
    case "cmp-picks":S.compare=PLAN.picks.map(k=>k.s.L.id).slice(0,3);go("compare");return;
    case "cmp-set":S.compare=(d.ids||"").split(",").filter(listingById).slice(0,3);render();return;
    case "alert":S.alerts[d.id]=!S.alerts[d.id];{const y=window.scrollY;render();window.scrollTo(0,y);}toast(S.alerts[d.id]?"Price-drop alert on":"Price-drop alert off");return;
    case "bought":S.bought=d.id;go("garage");return;
    case "unbuy":S.bought=null;go("home");return;
    case "req-reset":if(S.req[d.id]){S.req[d.id].sent=false;}render(true);return;
    case "fb":S.fb.open=!S.fb.open;S.fb.copied=false;renderFb();if(S.fb.open){const h=document.getElementById("fb-h");if(h){h.setAttribute("tabindex","-1");h.focus();}}else{const b=document.querySelector(".fbbtn");if(b)b.focus();}return;
    case "fb-save":{const dr=S.fb.draft;if(!S.fb.reaction&&!dr.like.trim()&&!dr.change.trim()&&!dr.add.trim()){toast("Pick a reaction or write a note first");return;}
      S.fb.sent=false;S.fb.notes.push({screen:screenName(),reaction:S.fb.reaction,like:dr.like.trim(),change:dr.change.trim(),add:dr.add.trim()});S.fb.draft={like:"",change:"",add:""};S.fb.reaction=null;S.fb.copied=false;persist();renderFb();toast(`Saved. ${S.fb.notes.length} note${S.fb.notes.length>1?"s":""} so far.`);return;}
    case "fb-copy":{const txt=fbText();S.fb.showText=true;const done=()=>{S.fb.copied=true;persist();renderFb();};
      try{navigator.clipboard.writeText(txt).then(done,()=>{S.fb.copied=false;renderFb();const b=document.getElementById("fb-copybox");if(b){b.focus();b.select();}toast("Select the text below and copy it");});}catch(err){renderFb();const b=document.getElementById("fb-copybox");if(b){b.focus();b.select();}}
      return;}
    case "fb-comment":{if(!COMMENTS)return;const el=document.getElementById("app");COMMENTS.openComposer({element:el}).then(r=>{if(r&&r.opened){S.fb.open=false;renderFb();}}).catch(()=>{COMMENTS=null;renderFb();toast("Comments aren't available in this view");});return;}
  }
  if(t.id==="next"){clearTimeout(advT);goNext();return;}
  if(t.id==="back"){clearTimeout(advT);if(S.idx>0){S.idx--;render(true);}return;}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="zipform"){e.preventDefault();const v=(document.getElementById("zip-live")||{}).value||"";const z=v.replace(/\D/g,"").slice(0,5);
    if(z.length!==5){toast("Enter a 5-digit ZIP code");return;}S.A.zip=z;S.liveKey=null;render(true);return;}
  if(e.target.id!=="reqform") return;
  e.preventDefault();
  const r=S.req[S.carId]; if(!r) return;
  const name=(document.getElementById("rq-name")||{}).value||"", email=(document.getElementById("rq-email")||{}).value||"";
  if(!name.trim()||!/^\S+@\S+\.\S+$/.test(email.trim())){r.err="Add your name and an email address so the seller can reply. Nothing is sent to the seller in this version.";render();const el=document.getElementById(!name.trim()?"rq-name":"rq-email");if(el)el.focus();return;}
  if(!r.consent){r.err="Tick the last box so FitDrive can pass your details to the seller.";render();const el=document.getElementById("rq-consent");if(el)el.focus();return;}
  r.err="";r.sent=true;render(true);
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.fb){S.fb.draft[el.dataset.fb]=el.value;S.fb.copied=false;persist();return;}
  const k=el.dataset&&el.dataset.in; if(!k) return;
  if(k==="zip"){
    el.value=el.value.replace(/\D/g,"").slice(0,5);
    if(el.value) S.A.zip=el.value; else delete S.A.zip;
    const pv=document.getElementById("zip-preview");
    if(pv){const p=makeProfile(S.A);pv.hidden=!p.local.known;pv.innerHTML=p.local.known?zipPreview(p):"";}
  } else {
    const n=el.value.replace(/[^\d]/g,""); if(n) S.A[k]=+n; else delete S.A[k];
    document.querySelectorAll(`[data-money="${k}"]`).forEach(c=>{c.classList.remove("on");c.setAttribute("aria-pressed","false");});
  }
  refreshLive();
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.car){if(el.value) S.A.wantCar=el.value; else delete S.A.wantCar; refreshLive(); return;}
  if(el.dataset.filter){const k=el.dataset.filter;S.filters[k]=isNaN(+el.value)?el.value:+el.value;render();return;}
  if(el.dataset.bfilter){const k=el.dataset.bfilter;S.browse[k]=isNaN(+el.value)?el.value:+el.value;render();return;}
  if(el.dataset.reqchk){const r=S.req[S.carId];if(r){r[el.dataset.reqchk]=el.checked;r.err="";const y=window.scrollY;const vals=["rq-name","rq-email","rq-phone"].map(id=>{const x=document.getElementById(id);return x?x.value:"";});render();["rq-name","rq-email","rq-phone"].forEach((id,i)=>{const x=document.getElementById(id);if(x)x.value=vals[i];});window.scrollTo(0,y);}return;}
  if(el.dataset.fbbest){S.fb.best=el.value;S.fb.copied=false;persist();return;}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.det){S.open[d.dataset.det]=d.open;persist();}},true);
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&S.view==="flow"&&e.target.matches("input")){e.preventDefault();goNext();}
  if(e.key==="Escape"){if(S.fb.open){S.fb.open=false;renderFb();const b=document.querySelector(".fbbtn");if(b)b.focus();}else if(S.langOpen){S.langOpen=false;render();}}
});
(function boot(){const r=parseRoute(location.hash);if(location.hash){S.view=r.view;S.carId=r.carId||null;}else{S.view="home";}render(false);})();

</script>

</body>
