# Carveyance — Netlify configuration
# Static site: no build step. Netlify serves the files as-is and
# auto-detects the contact forms in index.html on every deploy.

[build]
  publish = "."
  # No build command — this is hand-authored static HTML.

# Long cache for images only (they never change once uploaded).
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The site engine and article list must NOT be cached hard,
# or new articles won't show up until browsers expire the old copy.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/articles.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Same for the events list, or new events won't appear until caches expire.
[[headers]]
  for = "/events.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The Car Index: its car list, script and styles change when cars are added
[[headers]]
  for = "/cars/cars-data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cars/cars-common.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cars/cars.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Events app: the service worker and shared script must never be cached hard
[[headers]]
  for = "/events/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/events/events-common.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/events/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Sensible security headers site-wide
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Netlify automatically serves /404.html for unknown paths —
# no catch-all redirect needed (a catch-all here would shadow real pages).
